[postgresql_cluster]
master ansible_host=192.168.56.21 ansible_user=vagrant
replica ansible_host=192.168.56.22 ansible_user=vagrant
newserver ansible_host=192.168.56.23 ansible_user=vagrant

[postgresql_masters]
master

[postgresql_replicas]
replica
newserver

[postgresql_standby]
newserver

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
