name: CI-CD Docker GHCR

env:
  IMAGE_NAME: node-demo-app
  REGISTRY: ghcr.io

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Projet/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Projet

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: 5. Build & Push Docker image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ./Projet
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Trivy – Scan image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: 0

      - name: 7. Deploy container on server
        if: ${{ github.event_name == 'push' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

            docker pull $IMAGE

            docker stop node-demo-app || true
            docker rm node-demo-app || true

            docker run -d \
              --name node-demo-app \
              -p 80:3000 \
              --restart always \
              $IMAGE
