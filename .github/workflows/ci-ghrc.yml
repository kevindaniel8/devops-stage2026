name: CI-CD Docker GHCR

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Projet/**'
  pull_request:
  workflow_dispatch:

# ✅ AJOUT IMPORTANT
permissions:
  contents: read
  packages: write

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: Projet

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4.2.2

      - name: 2. Login to GHCR
        uses: docker/login-action@v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Build Docker image
        run: |
          IMAGE=ghcr.io/kevindaniel8/node-demo-app:latest
          docker build -t $IMAGE .

      - name: 3.Trivy – 3.1 Scan code (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: Projet

      - name: 3.Trivy – 3.2 Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/kevindaniel8/node-demo-app:latest

      - name: 4. Push Docker image
        run: |
          IMAGE=ghcr.io/kevindaniel8/node-demo-app:latest
          docker push $IMAGE

      - name: 5. Deploy container on server
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            IMAGE=ghcr.io/kevindaniel8/node-demo-app:latest
            docker pull $IMAGE
            docker stop node-demo-app || true
            docker rm node-demo-app || true
            docker run -d --name node-demo-app -p 80:3000 $IMAGE
