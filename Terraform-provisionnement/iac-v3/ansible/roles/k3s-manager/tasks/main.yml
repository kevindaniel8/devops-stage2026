---
# Installation des dépendances nécessaires aux modules Kubernetes d'Ansible
- name: Installer dépendances Python pour Ansible Kubernetes
  apt:
    name:
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: yes

# Téléchargement du binaire K3s
- name: Télécharger K3s (manager)
  get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: /usr/local/bin/k3s
    mode: '0755'

# Installation du service systemd
- name: Installer service systemd K3s manager
  template:
    src: k3s-manager.service.j2
    dest: /etc/systemd/system/k3s.service

# Activation et démarrage du service
- name: Activer et démarrer K3s manager
  systemd:
    name: k3s
    enabled: yes
    daemon_reload: yes
    state: restarted

