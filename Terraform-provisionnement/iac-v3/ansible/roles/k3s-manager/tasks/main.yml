---
# Attente des locks apt (cloud-init/unattended-upgrades)
- name: Attendre que les locks apt soient libérés
  shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
          fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
          fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
      echo "Waiting for apt locks..."
      sleep 5
    done
  args:
    executable: /bin/bash
  register: wait_for_apt
  changed_when: false

- name: Wait 10s for apt to stabilize
  pause:
    seconds: 10

# Installation des dépendances nécessaires aux modules Kubernetes d'Ansible
- name: Installer dépendances Python pour Ansible Kubernetes
  apt:
    name:
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: yes

# Téléchargement du binaire K3s (idempotent)
- name: Vérifier si K3s est déjà installé
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Télécharger K3s (manager)
  get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: /usr/local/bin/k3s
    mode: '0755'
  when: not k3s_binary.stat.exists

# Installation du service systemd
- name: Installer service systemd K3s manager
  template:
    src: k3s-manager.service.j2
    dest: /etc/systemd/system/k3s.service
  notify:
    - Reload systemd
    - Restart k3s

# Activation et démarrage du service
- name: Activer et démarrer K3s manager
  systemd:
    name: k3s
    enabled: yes
    state: started
  register: k3s_service

- name: Démarrer K3s si pas encore actif
  systemd:
    name: k3s
    state: started
  when: k3s_service is changed

