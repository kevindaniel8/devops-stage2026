---
- name: Installer paquets Docker (Debian/Ubuntu)
  apt:
    name:
      - docker.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Créer les répertoires de config des runners
  file:
    path: "{{ item.config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ gitlab_runner_instances }}"

- name: Créer le répertoire docker-compose
  file:
    path: "{{ gitlab_runner_docker_compose_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Déployer le docker-compose des runners
  template:
    src: docker-compose.yml.j2
    dest: "{{ gitlab_runner_docker_compose_path }}/docker-compose.yml"

- name: Démarrer les runners via docker compose
  command: docker compose up -d
  args:
    chdir: "{{ gitlab_runner_docker_compose_path }}"

# Enregistrement des runners (une fois, idempotence approximative)
- name: Enregistrer les runners
  command: >
    docker exec {{ item.name }} gitlab-runner register
    --non-interactive
    --url {{ gitlab_runner_coordinator_url }}
    --registration-token {{ gitlab_runner_registration_token }}
    --executor docker
    --docker-image {{ gitlab_runner_docker_image }}
    --description "{{ item.description }}"
  loop: "{{ gitlab_runner_instances }}"
  args:
    creates: "{{ item.config_dir }}/config.toml"
