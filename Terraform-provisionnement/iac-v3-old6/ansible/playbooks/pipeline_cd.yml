# =============================================================================
# PRÉ-REQUIS: Nettoyage des clés SSH host (IDEMPOTENCE)
# =============================================================================
# Supprime les anciennes clés SSH des known_hosts pour éviter les erreurs
# lorsque les VMs sont recréées avec de nouvelles clés host
# =============================================================================
- name: Nettoyer les clés SSH host connues
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Supprimer les anciennes clés SSH des cibles
      known_hosts:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ hostvars['harbor']['ansible_host'] | default('192.168.20.205') }}"
        - "{{ hostvars['k3s-manager']['ansible_host'] | default('192.168.20.220') }}"
        - "{{ hostvars['k3s-worker1']['ansible_host'] | default('192.168.20.221') }}"
        - "{{ hostvars['k3s-worker2']['ansible_host'] | default('192.168.20.222') }}"
      ignore_errors: yes
      changed_when: false
      tags: always

# =============================================================================
# ÉTAPE 1: HARBOR - Registry Docker Privée
# =============================================================================
# Harbor fournit:
#   - Registry Docker privée sécurisée
#   - Scan de vulnérabilités avec Trivy
#   - Gestion des artefacts (Helm charts, images)
#   - Interface web pour administration
#
# Accès: https://harbor.greencontracts.org
# =============================================================================
- import_playbook: deploy_harbor.yml

# =============================================================================
# ÉTAPE 2: K3S - Cluster Kubernetes Léger
# =============================================================================
# K3s fournit:
#   - Orchestration de conteneurs
#   - Ingress controller (Traefik)
#   - Stockage local (local-path-provisioner)
#   - Runtime containerd intégré
#
# Architecture: 1 manager + N workers
# API Server: https://192.168.20.220:6443
# =============================================================================
- import_playbook: deploy_k3s.yml

# =============================================================================
# ÉTAPE 3: ARGOCD - GitOps Continuous Delivery
# =============================================================================
# ArgoCD fournit:
#   - Déploiement GitOps (déclaratif)
#   - Synchronisation automatique avec repos Git
#   - Interface web de monitoring des applications
#   - Gestion multi-clusters
#
# Accès:
#   - Domaine: https://argo.greencontracts.org
#   - IP Directe: http://192.168.20.220:30080
# =============================================================================
- import_playbook: deploy-argocd.yml

