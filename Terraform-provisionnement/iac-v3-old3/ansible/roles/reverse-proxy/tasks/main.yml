---
###############################################################
# 0) INSTALLATION DE NGINX + PRÉPARATION
###############################################################

# 0.1 Installer nginx-full (support des modules dynamiques) + openssl
- name: 0.1 Installer Nginx et OpenSSL
  ansible.builtin.package:
    name:
      - nginx-full
      - openssl
    state: present

# 0.2 Créer le dossier des certificats
- name: 0.2 Créer le dossier des certificats
  ansible.builtin.file:
    path: /etc/nginx/certs
    state: directory
    mode: '0755'

# 0.3 Activer le module stream (nécessaire pour le proxy SSH)
- name: 0.3 Activer le module stream
  ansible.builtin.copy:
    dest: /etc/nginx/modules-enabled/50-mod-stream.conf
    content: "load_module modules/ngx_stream_module.so;"
    mode: '0644'
  notify: Reload nginx

# 0.4 Créer le dossier dédié aux configurations STREAM
- name: 0.4 Créer le dossier des streams Nginx
  ansible.builtin.file:
    path: /etc/nginx/streams-enabled
    state: directory
    mode: '0755'

# 0.5 Ajouter l'include des streams dans nginx.conf (avant http)
- name: 0.5 Ajouter include streams-enabled dans nginx.conf
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    insertafter: "include /etc/nginx/modules-enabled/\\*.conf;"
    line: "include /etc/nginx/streams-enabled/*.conf;"
  notify: Reload nginx

###############################################################
# 1) CERTIFICATS SSL
###############################################################

- name: 1.1 Générer certificat wildcard *.{{ reverse_proxy_domain }}
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048
    -keyout /etc/nginx/certs/wildcard.{{ reverse_proxy_domain }}.key
    -out /etc/nginx/certs/wildcard.{{ reverse_proxy_domain }}.crt
    -days {{ reverse_proxy_cert_days }}
    -subj "/C={{ reverse_proxy_country }}/ST={{ reverse_proxy_state }}/L={{ reverse_proxy_locality }}/O={{ reverse_proxy_org }}/OU={{ reverse_proxy_ou }}/CN=*.{{ reverse_proxy_domain }}"
    -addext "subjectAltName=DNS:{{ reverse_proxy_domain }},DNS:*.{{ reverse_proxy_domain }}"
  args:
    creates: "/etc/nginx/certs/wildcard.{{ reverse_proxy_domain }}.crt"
  notify: Reload nginx

- name: 1.2 Générer certificat {{ reverse_proxy_domain }}
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048
    -keyout /etc/nginx/certs/{{ reverse_proxy_domain }}.key
    -out /etc/nginx/certs/{{ reverse_proxy_domain }}.crt
    -days {{ reverse_proxy_cert_days }}
    -subj "/C={{ reverse_proxy_country }}/ST={{ reverse_proxy_state }}/L={{ reverse_proxy_locality }}/O={{ reverse_proxy_org }}/OU={{ reverse_proxy_ou }}/CN={{ reverse_proxy_domain }}"
    -addext "subjectAltName=DNS:{{ reverse_proxy_domain }}"
  args:
    creates: "/etc/nginx/certs/{{ reverse_proxy_domain }}.crt"
  notify: Reload nginx

###############################################################
# 2) CONSTRUCTION AUTOMATIQUE DES SERVICES
###############################################################

- name: 2.1 Construire reverse_proxy_services_auto
  set_fact:
    reverse_proxy_services_auto: "{{ reverse_proxy_services_auto | default({}) | combine({ item: hostvars[item].ansible_host }) }}"
  loop: "{{ groups['dns_clients'] }}"

- name: 2.2 Construire reverse_proxy_final
  set_fact:
    reverse_proxy_final: "{{ reverse_proxy_final | default({}) | combine({
      item: {
        'ip': (
          hostvars[ reverse_proxy_hosts.get(item, item) ].ansible_host
          if reverse_proxy_hosts.get(item, item) in hostvars
          else reverse_proxy_services_auto.get(item)
        ),
        'port': reverse_proxy_overrides.get(item, reverse_proxy_default_port)
      }
    }) }}"
  loop: "{{ (reverse_proxy_services_auto.keys() | list) + (reverse_proxy_overrides.keys() | list) }}"

###############################################################
# 3) DEPLOIEMENT DU SNIPPET SSL
###############################################################

- name: 3.1 Déployer le snippet SSL wildcard
  ansible.builtin.template:
    src: wildcard-ssl.conf.j2
    dest: /etc/nginx/snippets/wildcard-ssl.conf
    mode: '0644'
  notify: Reload nginx

###############################################################
# 4) DEPLOIEMENT DES VHOSTS HTTP
###############################################################

- name: 4.1 Déployer les vhosts Nginx
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.key }}.conf"
    mode: '0644'
  loop: "{{ reverse_proxy_final | dict2items }}"
  notify: Reload nginx

- name: 4.2 Activer les vhosts
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.key }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item.key }}.conf"
    state: link
  loop: "{{ reverse_proxy_final | dict2items }}"
  notify: Reload nginx

###############################################################
# 4B) CONFIG STREAM (SSH GITLAB)
###############################################################

# 4B.1 Supprimer l'ancien fichier fautif dans conf.d
#     → Empêche l'erreur "stream directive is not allowed here"
- name: 4B.1 Supprimer l'ancien fichier stream dans conf.d s'il existe
  ansible.builtin.file:
    path: /etc/nginx/conf.d/gitlab-stream.conf
    state: absent
  notify: Reload nginx

# 4B.2 Déployer la configuration STREAM propre
- name: 4B.2 Configurer le proxy SSH GitLab (stream)
  ansible.builtin.copy:
    dest: /etc/nginx/streams-enabled/gitlab-stream.conf
    mode: '0644'
    content: |
      stream {
          upstream gitlab_ssh {
              server 192.168.200.40:2222;
          }

          server {
              listen 2222;
              proxy_pass gitlab_ssh;
          }
      }
  notify: Reload nginx

###############################################################
# 5) ACTIVER NGINX
###############################################################

- name: 5.1 Activer et démarrer Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
