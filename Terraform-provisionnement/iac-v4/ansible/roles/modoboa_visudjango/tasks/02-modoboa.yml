---
# --------------------------------------------------
# 3 - Créer dossier Modoboa
# --------------------------------------------------
- name: "3 - Créer le dossier Modoboa"
  file:
    path: "{{ modoboa_docker_dir }}"
    state: directory
    mode: '0755'

# --------------------------------------------------
# 4 - Dockerfile
# --------------------------------------------------
- name: "4 - Copier Dockerfile"
  template:
    src: Dockerfile.j2
    dest: "{{ modoboa_docker_dir }}/Dockerfile"
  register: dockerfile_file

# --------------------------------------------------
# 5 - Entrypoint
# --------------------------------------------------
- name: "5 - Copier entrypoint.sh"
  template:
    src: entrypoint.sh.j2
    dest: "{{ modoboa_docker_dir }}/entrypoint.sh"
    mode: '0755'
  register: entrypoint_file

# --------------------------------------------------
# 6 - Compose
# --------------------------------------------------
- name: "6 - Copier docker-compose.yml"
  template:
    src: docker-compose.yml.j2
    dest: "{{ modoboa_docker_dir }}/docker-compose.yml"
  register: compose_file

# --------------------------------------------------
# 7 - Vérifier container existant
# --------------------------------------------------
- name: "7 - Check container existence"
  command: docker ps -q -f name=modoboa
  register: modoboa_container
  changed_when: false
  failed_when: false

# --------------------------------------------------
# 8 - Stop propre si nécessaire
# --------------------------------------------------
- name: "8 - Stop Modoboa si existant"
  command: docker compose down --remove-orphans
  args:
    chdir: "{{ modoboa_docker_dir }}"
  when: modoboa_container.stdout != ""

# --------------------------------------------------
# 9 - Attendre PostgreSQL externe (CRITIQUE)
# --------------------------------------------------
- name: "9 - Wait PostgreSQL availability"
  wait_for:
    host: "{{ modoboa_db_host }}"
    port: "{{ modoboa_db_port }}"
    delay: 3
    timeout: 60

# --------------------------------------------------
# 9.5 - Ensure Docker volume exists
# --------------------------------------------------
- name: "Ensure modoboa_data volume exists"
  command: docker volume create modoboa_modoboa_data
  register: volume_create
  changed_when: "'created' in volume_create.stdout"
  failed_when: false

# --------------------------------------------------
# 10 - Build image si nécessaire
# --------------------------------------------------
- name: "10 - Build image si nécessaire"
  command: docker compose build --no-cache
  args:
    chdir: "{{ modoboa_docker_dir }}"
  when: dockerfile_file.changed or entrypoint_file.changed or compose_file.changed

# --------------------------------------------------
# 11 - Start Modoboa
# --------------------------------------------------
- name: "11 - Start Modoboa"
  command: docker compose up -d --force-recreate
  args:
    chdir: "{{ modoboa_docker_dir }}"

# --------------------------------------------------
# 12 - Attendre que Modoboa soit installé
# --------------------------------------------------
- name: "12 - Wait for Modoboa settings.py to appear"
  wait_for:
    path: /var/lib/docker/volumes/modoboa_modoboa_data/_data/instance/instance/settings.py
    state: present
    delay: 5
    timeout: 120

# --------------------------------------------------
# 13 - Inject ALLOWED_HOSTS dans settings.py
# --------------------------------------------------
- name: "13 - Inject ALLOWED_HOSTS dans settings.py"
  lineinfile:
    path: /var/lib/docker/volumes/modoboa_modoboa_data/_data/instance/instance/settings.py
    regexp: '^ALLOWED_HOSTS ='
    line: "ALLOWED_HOSTS = ['{{ ansible_host }}', '{{ modoboa_domain }}', 'localhost', '127.0.0.1']"
  notify: Restart modoboa

# --------------------------------------------------
# 14 - Remove broken Django instance
# --------------------------------------------------
- name: "14 - Remove broken Django instance"
  file:
    path: /var/lib/docker/volumes/modoboa_modoboa_data/_data/instance
    state: absent

# --------------------------------------------------
# 15 - Restart container to trigger fresh deploy
# --------------------------------------------------
- name: "15 - Restart modoboa container"
  command: docker restart modoboa

# --------------------------------------------------
# 16 - Wait for Modoboa settings.py after redeploy
# --------------------------------------------------
- name: "16 - Wait for Modoboa settings.py after redeploy"
  wait_for:
    path: /var/lib/docker/volumes/modoboa_modoboa_data/_data/instance/instance/settings.py
    state: present
    delay: 5
    timeout: 120

# --------------------------------------------------
# 13 - Inject ALLOWED_HOSTS dans settings.py
# --------------------------------------------------
- name: "13 - Inject ALLOWED_HOSTS dans settings.py"
  lineinfile:
    path: /var/lib/docker/volumes/modoboa_modoboa_data/_data/instance/instance/settings.py
    regexp: '^ALLOWED_HOSTS ='
    line: "ALLOWED_HOSTS = ['{{ ansible_host }}', '{{ modoboa_domain }}', 'localhost', '127.0.0.1']"
  notify: Restart modoboa

# --------------------------------------------------
# 17 - Vérifier que le conteneur tourne
# --------------------------------------------------
- name: "17 - Wait Modoboa container ready"
  command: docker ps --filter "name=modoboa" --format "{% raw %}{{.Status}}{% endraw %}"
  register: modoboa_status
  retries: 10
  delay: 3
  until: "'Up' in modoboa_status.stdout"
  changed_when: false

# --------------------------------------------------
# 18 - Vérification finale
# --------------------------------------------------
- name: "14 - Final check"
  command: docker logs modoboa
  register: final_status
  changed_when: false


