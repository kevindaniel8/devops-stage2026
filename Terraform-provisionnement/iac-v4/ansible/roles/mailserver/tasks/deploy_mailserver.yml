---
- name: Créer les dossiers nécessaires
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ mailserver_data_dir }}"
    - "{{ mailserver_config_dir }}"
    - "{{ mailserver_state_dir }}"
    - "{{ mailserver_config_dir }}/mail-data"
    - "{{ mailserver_config_dir }}/ssl"

- name: Créer le dossier pour les comptes mail
  file:
    path: "{{ mailserver_config_dir }}/postfix-accounts.cf"
    state: touch
    owner: root
    group: root
    mode: "0600"

- name: Créer le compte mail admin initial
  lineinfile:
    path: "{{ mailserver_config_dir }}/postfix-accounts.cf"
    line: "admin@{{ mail_domain | default(main_domain) }}|{{ mail_admin_password | default('admin123') }}|admin|"
    create: yes
    owner: root
    group: root
    mode: "0600"

- name: Générer certificat SSL self-signed pour docker-mailserver
  command: openssl req -newkey rsa:4096 -nodes -sha256 -keyout {{ mailserver_config_dir }}/ssl/key.pem -x509 -days 365 -out {{ mailserver_config_dir }}/ssl/cert.pem -subj "/CN={{ mailserver_hostname }}"
  args:
    creates: "{{ mailserver_config_dir }}/ssl/cert.pem"

- name: Copier docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ mailserver_config_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Lancer docker-mailserver
  community.docker.docker_compose_v2:
    project_src: "{{ mailserver_config_dir }}"
    state: present
    pull: always
