---
- name: Créer le namespace ArgoCD
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: present

- name: Télécharger le manifest ArgoCD
  get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "/tmp/argocd-install.yaml"

- name: Installer ArgoCD
  kubernetes.core.k8s:
    state: present
    src: "/tmp/argocd-install.yaml"
    namespace: "{{ argocd_namespace }}"

# 👉 AJOUTER ICI
- name: Désactiver le HTTPS forcé d'ArgoCD
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"

# 👉 Ingress pour accès par nom de domaine (production)
- name: Déployer l'Ingress ArgoCD (domaine)
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd-server-ingress
        annotations:
          kubernetes.io/ingress.class: traefik
      spec:
        rules:
        - host: "{{ argocd_domain }}"
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: argocd-server
                  port:
                    number: 80

# 👉 Service NodePort pour accès direct par IP (développement - sans DNS)
# Permet d'accéder à ArgoCD via http://IP:30092 (plage NodePort: 30000-32767)
- name: Créer le Service NodePort pour accès direct par IP
  kubernetes.core.k8s:
    state: patched
    namespace: "{{ argocd_namespace }}"
    name: argocd-server
    api_version: v1
    kind: Service
    definition:
      spec:
        type: NodePort
        ports:
        - port: 80
          targetPort: 8080
          nodePort: 30080
          protocol: TCP
          name: http
  when: argocd_enable_ip_access | bool

