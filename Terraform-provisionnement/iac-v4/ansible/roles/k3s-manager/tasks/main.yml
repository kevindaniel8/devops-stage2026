---
# ============================================================
# ROLE K3S MANAGER
# Installation et configuration complète de K3s
# avec support Harbor privé
# ============================================================

# ============================================================
# 1. ATTENTE DES LOCKS APT
# Évite les conflits avec cloud-init et unattended-upgrades
# ============================================================

- name: Attendre que les locks apt soient libérés
  shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
          fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
          fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
      echo "Waiting for apt locks..."
      sleep 5
    done
  args:
    executable: /bin/bash
  register: wait_for_apt
  changed_when: false

# Petite temporisation de sécurité
- name: Wait 10s for apt to stabilize
  pause:
    seconds: 10


# ============================================================
# 2. INSTALLATION DES DÉPENDANCES PYTHON
# Nécessaires aux modules Kubernetes d'Ansible
# ============================================================

- name: Installer dépendances Python pour Ansible Kubernetes
  apt:
    name:
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: yes


# ============================================================
# 3. VÉRIFICATION INSTALLATION K3S
# Vérifie si le binaire existe déjà
# ============================================================

- name: Vérifier si K3s est déjà installé
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary


# ============================================================
# 4. TÉLÉCHARGEMENT K3S
# Téléchargement idempotent
# ============================================================

- name: Télécharger K3s (manager)
  get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: /usr/local/bin/k3s
    mode: '0755'
  when: not k3s_binary.stat.exists


# ============================================================
# 5. CRÉATION DOSSIER CONFIG K3S
# Nécessaire pour registries.yaml
# ============================================================

- name: Créer le dossier /etc/rancher/k3s
  file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'


# ============================================================
# 6. CONFIGURATION HARBOR POUR K3S
# Permet à containerd de pull les images privées
# depuis Harbor HTTPS interne
# ============================================================

- name: Configurer Harbor registry pour K3s
  copy:
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      mirrors:
        "192.168.20.205":
          endpoint:
            - "http://192.168.20.205"

      configs:
        "192.168.20.205":
          tls:
            insecure_skip_verify: true
  notify:
    - Restart k3s


# ============================================================
# 7. AJOUT DNS LOCAL HARBOR
# Utile si le serveur ne résout pas le domaine .lan
# ============================================================

- name: Ajouter Harbor dans /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "192.168.20.205 harbor.greencontracts.lan"
    state: present


# ============================================================
# 8. INSTALLATION SERVICE SYSTEMD K3S
# Déploiement du service systemd manager
# ============================================================

- name: Installer service systemd K3s manager
  template:
    src: k3s-manager.service.j2
    dest: /etc/systemd/system/k3s.service
  notify:
    - Reload systemd
    - Restart k3s


# ============================================================
# 9. ACTIVATION ET DÉMARRAGE K3S
# ============================================================

- name: Activer et démarrer K3s manager
  systemd:
    name: k3s
    enabled: yes
    state: started
  register: k3s_service


# ============================================================
# 10. DÉMARRAGE SI CHANGEMENT
# Relance si modification du service
# ============================================================

- name: Démarrer K3s si pas encore actif
  systemd:
    name: k3s
    state: started
  when: k3s_service is changed


# ============================================================
# 11. VÉRIFICATION KUBECTL
# Validation finale du cluster
# ============================================================

- name: Vérifier le statut du cluster K3s
  shell: |
    k3s kubectl get nodes
  register: k3s_nodes
  changed_when: false

- name: Afficher les nodes K3s
  debug:
    var: k3s_nodes.stdout_lines

