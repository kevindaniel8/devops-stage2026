---
# =============================================================================
# Rôle ssl-ca-interne - Gestion de CA interne et certificats X.509
# =============================================================================
# Ce rôle génère une CA racine et des certificats pour les services LAN
# Utilise les modules Ansible openssl_* pour l'idempotence
# =============================================================================

# -----------------------------------------------------------------------------
# Chemins relatifs (indépendants de la machine hôte)
# -----------------------------------------------------------------------------
ssl_ca_base_dir: "{{ playbook_dir }}/../files/pki/ca"
ssl_certs_base_dir: "{{ playbook_dir }}/../files/pki/certs"
ssl_keys_base_dir: "{{ playbook_dir }}/../files/pki/keys"

# -----------------------------------------------------------------------------
# Configuration CA
# -----------------------------------------------------------------------------
ssl_ca_common_name: "{{ ca_common_name | default('GreenContracts-Root-CA') }}"
ssl_ca_validity_days: "{{ ca_validity_days | default(3650) }}"
ssl_ca_key_size: "{{ cert_key_size | default(4096) }}"

# Fichiers CA
ssl_ca_key_file: "{{ ssl_ca_base_dir }}/ca.key"
ssl_ca_cert_file: "{{ ssl_ca_base_dir }}/ca.crt"

# -----------------------------------------------------------------------------
# Configuration certificats serveur
# -----------------------------------------------------------------------------
ssl_cert_validity_days: "{{ cert_validity_days | default(365) }}"
ssl_cert_key_size: "{{ cert_key_size | default(4096) }}"

# -----------------------------------------------------------------------------
# Configuration déploiement
# -----------------------------------------------------------------------------
ssl_deploy_ca_path: /usr/local/share/ca-certificates
ssl_deploy_ca_name: greencontracts-ca.crt
ssl_nginx_certs_path: /etc/nginx/ssl

# -----------------------------------------------------------------------------
# Services avec certificats internes (généré depuis hosts.yml)
# -----------------------------------------------------------------------------
ssl_internal_services: >-
  {{
    services
    | dict2items
    | selectattr('value.tls_mode', 'defined')
    | selectattr('value.tls_mode', 'equalto', 'internal_ca')
  }}
