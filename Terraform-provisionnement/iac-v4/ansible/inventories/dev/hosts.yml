all:
  vars:
    # Idempotence: Gestion automatique des clés SSH host
    # Évite les erreurs lorsque les VMs sont recréées avec de nouvelles clés
    ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    # Variables globales existantes
    dns_server_ip: "192.168.20.2"
    betzel_hub_ip: "192.168.20.4"
    pg_cluster_master: "192.168.20.20"
    pg_cluster_replica: "192.168.20.21"

    # Domaine principal
    main_domain: "greencontracts.lan"

    ###########################################################################
    # Activation TLS globale pour le reverse-proxy
    #
    # Valeur par défaut : false (pour éviter les erreurs tant que les certificats
    # ne sont pas encore générés)
    #
    # Valeur finale prévue dans ton architecture : true
    # (à activer après déploiement de ssl-ca-interne ou letsencrypt)
    ###########################################################################
    enable_tls: false   # valeur finale prévue : true

    ###########################################################################
    # CATALOGUE DE SERVICES (NOUVEAU)
    # Utilisé par :
    #  - reverse-proxy
    #  - ssl-ca-interne
    #  - letsencrypt
    #  - orchestrateur
    ###########################################################################
    

    # ==============================
    #  CATALOGUE DE SERVICES
    #  (pour reverse-proxy + certs)
    # ==============================
    
    services:

      # -------------------------
      # Reverse Proxy (Nginx)
      # -------------------------
      reverse_proxy:
        backend_type: vm
        backend_host: "reverse-proxy"  # host Ansible existant
        backend_ip: "192.168.20.3"
        backend_port: 80
        fqdn: "proxy.greencontracts.lan"
        tls_mode: "internal_ca"      # none | letsencrypt | internal_ca
        expose_external: false

      # -------------------------
      # Moodle (Kubernetes via NodePort)
      # -------------------------
      moodle:
        backend_type: kubernetes
        backend_host: "k3s-manager"     # noeud qui porte le NodePort
        node_ip: "192.168.20.220"
        node_port: 30081
        namespace: "moodle"
        service_name: "moodle-service"
        service_port: 8080
        fqdn: "moodle.greencontracts.lan"
        tls_mode: "internal_ca" # letsencrypt si possible aprés pour etre accessible publiquement
        expose_external: true

      # -------------------------
      # ArgoCD (local only)
      # -------------------------
      argocd:
        backend_type: kubernetes
        backend_host: "k3s-manager"
        node_ip: "192.168.20.220"
        node_port: 30080
        fqdn: "argocd.greencontracts.lan"
        tls_mode: "internal_ca"
        expose_external: false

      # -------------------------
      # WikiJS
      # -------------------------
      wikijs:
        backend_type: vm
        backend_host: "wikijs"
        backend_ip: "192.168.20.4"
        backend_port: 3000
        fqdn: "wikijs.greencontracts.lan"
        tls_mode: "internal_ca"      # none | letsencrypt | internal_ca
        expose_external: true

      # -------------------------
      # Nextcloud
      # -------------------------
      nextcloud:
        backend_type: vm
        backend_host: "nextcloud"
        backend_ip: "192.168.20.10"
        backend_port: 80
        fqdn: "nextcloud.greencontracts.lan"
        tls_mode: "internal_ca" # "letsencrypt"
        expose_external: true

      # -------------------------
      # Modoboa (Mail)
      # -------------------------
      mail:
        backend_type: vm
        backend_host: "mailserver"
        backend_ip: "192.168.20.3"
        backend_port: 8000
        fqdn: "mail.greencontracts.lan"
        tls_mode: "internal_ca" #letsencrypt
        expose_external: true

      # -------------------------
      # Harbor
      # -------------------------
      harbor:
        backend_type: vm
        backend_host: "harbor"
        backend_ip: "192.168.20.205"
        backend_port: 80
        fqdn: "harbor.greencontracts.lan"
        tls_mode: "internal_ca"      # none | letsencrypt | internal_ca
        expose_external: true

      # -------------------------
      # beszel
      # -------------------------
      beszel:
        backend_type: vm
        backend_host: "snmp"
        backend_ip: "192.168.20.4"
        backend_port: 8090
        fqdn: "beszel.greencontracts.lan"
        tls_mode: "internal_ca"      # none | letsencrypt | internal_ca
        expose_external: true


  #############################################################################
  # GROUPES EXISTANTS (inchangés, juste replacés proprement)
  #############################################################################
  children:

    reverse_proxy:
      hosts:
        reverse-proxy:
          ansible_host: 192.168.20.3
          ansible_user: ubuntu

    cert_clients:
      hosts:
        mailserver:
          ansible_host: 192.168.20.3
          ansible_user: ubuntu

        snmp:
          ansible_host: 192.168.20.4
          ansible_user: ubuntu

        wikijs:
          ansible_host: 192.168.20.4
          ansible_user: ubuntu
          
        nextcloud:
          ansible_host: 192.168.20.10
          ansible_user: ubuntu

        harbor:
          ansible_host: 192.168.20.205
          ansible_user: ubuntu

        k3s-manager:
          ansible_host: 192.168.20.220
          ansible_user: ubuntu

        k3s-worker1:
          ansible_host: 192.168.20.221
          ansible_user: ubuntu

        k3s-worker2:
          ansible_host: 192.168.20.222
          ansible_user: ubuntu

        samba-ad-dc:
          ansible_host: 192.168.20.2
          ansible_user: ubuntu
          ansible_become: true


    ###########################################################################
    # DNS (corrigé)
    ###########################################################################
    dns:
      hosts:
        samba-ad-dc:

    dns_clients:
      children:
        k3s_manager:
        k3s_worker:
      hosts:
        reverse-proxy:
        mailserver:
        snmp:
        wikijs:
        nextcloud:
        harbor:
        db-postgres-master:
        db-postgres-replication:
        #mariadb:

    ###########################################################################
    # K3S
    ###########################################################################
    k3s_manager:
      hosts:
        k3s-manager:

    k3s_worker:
      hosts:
        k3s-worker1:
        k3s-worker2:


    ###########################################################################
    # Active Directory
    ###########################################################################
    dc:
      hosts:
        samba-ad-dc:


    ###########################################################################
    # Beszel Agents
    ###########################################################################
    beszel_agents:
      vars:
        beszel_agent_enabled: true
      hosts:
        snmp:



    # -------------------------------------------------------------------------
    # CLUSTER POSTGRESQL (pour tests repmgr)
    # -------------------------------------------------------------------------
    # Déploiement via clé SSH (ansible-playbook)
    # Accès manuel via mot de passe toujours disponible
    # -------------------------------------------------------------------------
    database:
      children:
        db_master:
        db_replica:
      vars:
        ansible_user: ubuntu
        # Clé SSH pour le déploiement ansible
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_terraform-proxmox
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        ansible_python_interpreter: /usr/bin/python3
        # Password devient optionnel (pour become)
        ansible_become_password: "ubuntu"

    db_master:
      hosts:
        db-postgres-master:
          ansible_host: 192.168.20.20
          node_id: 1
          node_name: db-postgres-master

    db_replica:
      hosts:
        db-postgres-replication:
          ansible_host: 192.168.20.21
          node_id: 2
          node_name: db-postgres-replication
          upstream_node_id: 1
          upstream_node_name: db-postgres-master


    ###########################################################################
    # MARIADB (commenté comme demandé)
    ###########################################################################
    # db:
    #   hosts:
    #     mariadb:
    #       ansible_host: 192.168.20.30
    #       ansible_user: ubuntu
    #       ansible_password: "ubuntu"
    #       ansible_become_password: "ubuntu"
    #       ansible_ssh_common_args: "-o PreferredAuthentications=password"
    #       ansible_python_interpreter: /usr/bin/python3


    ###########################################################################
    # MANAGEMENT
    ###########################################################################
    management:
      hosts:
        pc-management:
          ansible_connection: local

