---
- name: Installer Nginx et OpenSSL
  ansible.builtin.package:
    name:
      - nginx
      - openssl
    state: present

- name: Créer le dossier des certificats
  ansible.builtin.file:
    path: /etc/nginx/certs
    state: directory
    mode: '0755'

###############################################################
# 1) CERTIFICAT WILDCARD (*.kevin.lan)
###############################################################
- name: Générer certificat wildcard *.{{ reverse_proxy_domain }}
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048
    -keyout /etc/nginx/certs/wildcard.{{ reverse_proxy_domain }}.key
    -out /etc/nginx/certs/wildcard.{{ reverse_proxy_domain }}.crt
    -days {{ reverse_proxy_cert_days }}
    -subj "/C={{ reverse_proxy_country }}/ST={{ reverse_proxy_state }}/L={{ reverse_proxy_locality }}/O={{ reverse_proxy_org }}/OU={{ reverse_proxy_ou }}/CN=*.{{ reverse_proxy_domain }}"
    -addext "subjectAltName=DNS:{{ reverse_proxy_domain }},DNS:*.{{ reverse_proxy_domain }}"
  args:
    creates: "/etc/nginx/certs/wildcard.{{ reverse_proxy_domain }}.crt"
  notify: Reload nginx

###############################################################
# 2) CERTIFICAT POUR LE DOMAINE RACINE (kevin.lan)
###############################################################
- name: Générer certificat {{ reverse_proxy_domain }}
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048
    -keyout /etc/nginx/certs/{{ reverse_proxy_domain }}.key
    -out /etc/nginx/certs/{{ reverse_proxy_domain }}.crt
    -days {{ reverse_proxy_cert_days }}
    -subj "/C={{ reverse_proxy_country }}/ST={{ reverse_proxy_state }}/L={{ reverse_proxy_locality }}/O={{ reverse_proxy_org }}/OU={{ reverse_proxy_ou }}/CN={{ reverse_proxy_domain }}"
    -addext "subjectAltName=DNS:{{ reverse_proxy_domain }}"
  args:
    creates: "/etc/nginx/certs/{{ reverse_proxy_domain }}.crt"
  notify: Reload nginx

###############################################################
# 3) CERTIFICATS INDIVIDUELS POUR CHAQUE SERVICE (OPTIONNEL)
###############################################################
- name: Générer les certificats autosignés pour chaque service
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048
    -keyout /etc/nginx/certs/{{ item.key }}.key
    -out /etc/nginx/certs/{{ item.key }}.crt
    -days {{ reverse_proxy_cert_days }}
    -subj "/C={{ reverse_proxy_country }}/ST={{ reverse_proxy_state }}/L={{ reverse_proxy_locality }}/O={{ reverse_proxy_org }}/OU={{ reverse_proxy_ou }}/CN={{ item.key }}"
    -addext "subjectAltName=DNS:{{ item.key }}"
  args:
    creates: "/etc/nginx/certs/{{ item.key }}.crt"
  loop: "{{ reverse_proxy_services | dict2items }}"
  notify: Reload nginx

###############################################################
# 4) DEPLOIEMENT DES VHOSTS
###############################################################
- name: Déployer les vhosts Nginx
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/sites-enabled/{{ item.key }}.conf"
    mode: '0644'
  loop: "{{ reverse_proxy_services | dict2items }}"
  notify: Reload nginx

###############################################################
# 5) ACTIVER NGINX
###############################################################
- name: Activer et démarrer Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
