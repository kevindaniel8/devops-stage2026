---
# Emplacement de la clé GPG Docker
#docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_keyring_path: /etc/apt/keyrings/docker.gpg


# Fichier source APT Docker
docker_sources_file: /etc/apt/sources.list.d/docker.sources

# Paquets Docker Engine officiels
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
