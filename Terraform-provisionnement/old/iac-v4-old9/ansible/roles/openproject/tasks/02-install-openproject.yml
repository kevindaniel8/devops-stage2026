---

- name: "1. Ajouter ubuntu au groupe docker"
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: "2. Créer les dossiers OpenProject"
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - "{{ openproject_data_dir }}"
    - "{{ openproject_data_dir }}/pgdata"
    - "{{ openproject_data_dir }}/assets"
    - "{{ openproject_data_dir }}/custom"

- name: "3. Déployer docker-compose.yml"
  template:
    src: docker-compose.yml.j2
    dest: "{{ openproject_data_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: "4. Lancer OpenProject via docker-compose"
  command:
    cmd: docker compose up -d
    chdir: "{{ openproject_data_dir }}"
  register: compose_result
  changed_when: true

- name: "5. Afficher l'état du déploiement"
  debug:
    msg: "OpenProject déployé. Changements: {{ compose_result.changed }}"
