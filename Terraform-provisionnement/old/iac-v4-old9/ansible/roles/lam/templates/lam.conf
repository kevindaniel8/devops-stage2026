# Configuration LAM pour Samba AD
# Fichier de configuration principal

# Serveur principal
ServerURL: ldap://192.168.56.5:389

# Désactiver TLS pour le moment (à activer plus tard si besoin)
UseTLS: no
UseSSL: no

# Informations de connexion
Admins: "cn=Administrator,cn=Users,dc=lab,dc=local"

# Base DN
Trees: "dc=lab,dc=local"

# Langue
defaultLanguage: fr_FR

# Mot de passe admin (sera configuré via l'interface)
Passwd: none

# Configuration des types de comptes
types: user,group

# Active Directory spécifique
ActiveDirectory: yes

# Time limit
searchLimit: 50
# Maximum time to wait for LDAP server response in seconds.
timeLimit: 30

# Module cache
moduleCache: yes

# Security settings
passwordMinLength: 8
passwordMinUpper: 1
passwordMinLower: 1
passwordMinNumeric: 1

# Session
sessionTimeout: 1800
loginMethod: list
