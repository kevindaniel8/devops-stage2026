---
# Variables spécifiques au replica
node_id: 2
node_name: node2
is_primary: false
role: replica
upstream_node_id: 1
upstream_node_name: node1

# Configuration spécifique replica
postgresql_config:
  max_wal_senders: 5
  max_replication_slots: 5
  
# Ports Vagrant
vagrant:
  forwarded_ports:
    - guest: 5432
      host: 5434
