---
# =============================================================================
# Rôle ssl-letsencrypt - Gestion des certificats Let's Encrypt
# =============================================================================
# Ce rôle gère la génération et le renouvellement des certificats Let's Encrypt
# pour les services exposés publiquement
# =============================================================================

# -----------------------------------------------------------------------------
# Configuration Certbot
# -----------------------------------------------------------------------------
ssl_letsencrypt_email: "{{ letsencrypt_email | default('kevin@example.com') }}"
ssl_letsencrypt_staging: "{{ letsencrypt_staging | default(true) }}"
ssl_letsencrypt_certbot_package: certbot
ssl_letsencrypt_certbot_nginx_package: python3-certbot-nginx

# -----------------------------------------------------------------------------
# Chemins
# -----------------------------------------------------------------------------
ssl_letsencrypt_config_dir: /etc/letsencrypt
ssl_letsencrypt_work_dir: /var/lib/letsencrypt
ssl_letsencrypt_logs_dir: /var/log/letsencrypt
ssl_letsencrypt_certs_path: /etc/letsencrypt/live
ssl_nginx_certs_path: /etc/nginx/ssl

# -----------------------------------------------------------------------------
# Services avec certificats Let's Encrypt (généré depuis hosts.yml)
# -----------------------------------------------------------------------------
ssl_letsencrypt_services: >-
  {{
    services
    | dict2items
    | selectattr('value.tls_mode', 'defined')
    | selectattr('value.tls_mode', 'equalto', 'letsencrypt')
  }}

# -----------------------------------------------------------------------------
# Configuration renouvellement
# -----------------------------------------------------------------------------
ssl_letsencrypt_renew_before_expiry: 30  # jours
