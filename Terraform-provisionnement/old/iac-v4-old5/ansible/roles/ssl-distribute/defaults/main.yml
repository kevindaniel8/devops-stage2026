---
# =============================================================================
# Rôle ssl-distribute - Distribution des certificats aux services
# =============================================================================
# Ce rôle distribue les certificats (CA interne ou Let's Encrypt) aux services
# qui en ont besoin, en fonction de leur configuration tls_mode
# =============================================================================

# -----------------------------------------------------------------------------
# Chemins
# -----------------------------------------------------------------------------
ssl_distribute_ca_path: /usr/local/share/ca-certificates
ssl_distribute_ca_internal_name: greencontracts-ca.crt
ssl_distribute_ca_letsencrypt_name: letsencrypt-isrgrootx1.crt

# -----------------------------------------------------------------------------
# Configuration des services
# -----------------------------------------------------------------------------
ssl_distribute_services: "{{ services }}"

# -----------------------------------------------------------------------------
# Mapping des services vers leurs hôtes
# -----------------------------------------------------------------------------
ssl_distribute_service_hosts: >-
  {{
    {
      'reverse_proxy': groups['reverse_proxy'] | default([]),
      'moodle': groups['k3s_manager'] | default([]),
      'argocd': groups['k3s_manager'] | default([]),
      'wikijs': groups['wikijs'] | default([]),
      'nextcloud': groups['nextcloud'] | default([]),
      'mail': groups['mailserver'] | default([]),
      'harbor': groups['harbor'] | default([]),
      'beszel': groups['snmp'] | default([])
    }
  }}
