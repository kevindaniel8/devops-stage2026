---
# Déploiement complet du cluster PostgreSQL repmgr (master + replica)
- name: Déploiement du cluster PostgreSQL repmgr
  hosts: "{{ target_host | default('all') }}"
  become: yes
  vars:
    postgresql_version: 16
    postgres_user: postgres
    repmgr_user: repmgr
    repmgr_database: repmgr
    postgres_password: "{{ postgres_password | default('postgres') }}"
    repmgr_password: "{{ repmgr_password | default('repmgr_password') }}"
    master_ip: "{{ master_ip | default('192.168.56.21') }}"
    replica_ip: "{{ replica_ip | default('192.168.56.22') }}"
    new_server_ip: "{{ new_server_ip | default('192.168.56.23') }}"
  roles:
    - postgresql

- name: Configuration et enregistrement repmgr
  hosts: "{{ target_host | default('all') }}"
  become: yes
  vars:
    is_primary: "{{ inventory_hostname == 'master' }}"
    node_id: "{{ '1' if inventory_hostname == 'master' else '2' }}"
    node_name: "{{ inventory_hostname }}"
    upstream_node_id: "{{ '1' if inventory_hostname == 'replica' else omit }}"
    upstream_node_name: "{{ 'master' if inventory_hostname == 'replica' else omit }}"
    postgres_password: "{{ postgres_password | default('postgres') }}"
    repmgr_password: "{{ repmgr_password | default('repmgr_password') }}"
    master_ip: "{{ master_ip | default('192.168.56.21') }}"
    replica_ip: "{{ replica_ip | default('192.168.56.22') }}"
    new_server_ip: "{{ new_server_ip | default('192.168.56.23') }}"
  tasks:
    - name: Création du dossier de configuration repmgr
      file:
        path: "/etc/repmgr/16"
        state: directory
        owner: postgres
        group: postgres
        mode: '0755'

    - name: Configuration de repmgr.conf
      template:
        src: repmgr.conf.j2
        dest: "/etc/repmgr/16/repmgr.conf"
        owner: postgres
        group: postgres
        mode: '0644'

    - name: Création du fichier .pgpass pour repmgr
      copy:
        dest: "/var/lib/postgresql/.pgpass"
        content: "{{ ansible_host }}:5432:{{ repmgr_database }}:{{ repmgr_user }}:{{ repmgr_password }}"
        owner: postgres
        group: postgres
        mode: '0600'
      become_user: root

    - name: Redémarrage PostgreSQL pour réplication
      systemd:
        name: "postgresql@16-main"
        state: restarted
        enabled: yes

    - name: Attendre que PostgreSQL soit prêt
      shell: |
        sleep 5
        sudo -u postgres /usr/lib/postgresql/16/bin/pg_isready -h /var/run/postgresql -p 5432
      become_user: root
      retries: 3
      delay: 5

    - name: Enregistrement du master
      shell: |
        export PGPASSWORD={{ repmgr_password }}
        repmgr -f /etc/repmgr/16/repmgr.conf primary register
      become_user: postgres
      when: inventory_hostname == 'master'
      register: master_register
      failed_when: false

    - name: Clonage depuis le master (replica)
      block:
        - name: Arrêter PostgreSQL sur replica
          systemd:
            name: "postgresql@16-main"
            state: stopped
          become_user: root

        - name: Nettoyer les données existantes
          shell: |
            rm -rf /var/lib/postgresql/16/main/*
            mkdir -p /var/lib/postgresql/16/main
            chown postgres:postgres /var/lib/postgresql/16/main
            chmod 700 /var/lib/postgresql/16/main
          become_user: root

        - name: Clonage depuis le master
          shell: |
            export PGPASSWORD={{ repmgr_password }}
            repmgr -f /etc/repmgr/16/repmgr.conf standby clone -h {{ master_ip }} -U {{ repmgr_user }} -d {{ repmgr_database }} --verbose
          become_user: postgres
          register: clone_result
          failed_when: false

        - name: Démarrage PostgreSQL replica
          systemd:
            name: "postgresql@16-main"
            state: started
          become_user: root

        - name: Attendre que PostgreSQL soit prêt
          shell: |
            sleep 5
            sudo -u postgres /usr/lib/postgresql/16/bin/pg_isready -h /var/run/postgresql -p 5432
          become_user: root
          retries: 3
          delay: 5

        - name: Enregistrement du replica
          shell: |
            export PGPASSWORD={{ repmgr_password }}
            repmgr -f /etc/repmgr/16/repmgr.conf standby register
          become_user: postgres
          register: replica_register
          failed_when: false
      when: inventory_hostname == 'replica'

    - name: Vérification du cluster
      shell: |
        export PGPASSWORD={{ repmgr_password }}
        repmgr -f /etc/repmgr/16/repmgr.conf cluster show
      become_user: postgres
      register: cluster_status
      failed_when: false

    - name: Affichage du statut
      debug:
        msg: |
          🎉 Cluster PostgreSQL repmgr configuré !
          📍 Nœud: {{ inventory_hostname }} ({{ 'Master' if inventory_hostname == 'master' else 'Replica' }})
          📊 Cluster:
          {{ cluster_status.stdout_lines | join('\n') if cluster_status is defined else 'Non disponible' }}
