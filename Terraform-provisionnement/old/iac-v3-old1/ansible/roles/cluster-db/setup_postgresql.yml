---
# Installation PostgreSQL uniquement (sans repmgr)
- name: Installation PostgreSQL
  hosts: "{{ target_host | default('all') }}"
  become: yes
  vars:
    postgresql_version: 16
    postgres_user: postgres
    repmgr_user: repmgr
    repmgr_database: repmgr
    postgres_password: "{{ postgres_password | default('postgres') }}"
    repmgr_password: "{{ repmgr_password | default('repmgr_password') }}"
    master_ip: "{{ master_ip | default('192.168.56.21') }}"
    replica_ip: "{{ replica_ip | default('192.168.56.22') }}"
    new_server_ip: "{{ new_server_ip | default('192.168.56.23') }}"
  tasks:
    - name: Ajout de la clé GPG PostgreSQL
      apt_key:
        url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
        state: present

    - name: Ajout du dépôt PostgreSQL
      apt_repository:
        repo: "deb http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main"
        state: present
        update_cache: yes

    - name: Installation de PostgreSQL
      apt:
        name: 
          - postgresql-16
          - postgresql-client-16
          - python3-psycopg2
        state: present
        update_cache: yes

    - name: Installation de repmgr depuis les dépôts PostgreSQL
      apt:
        name: 
          - postgresql-16-repmgr
        state: present
        update_cache: yes
      ignore_errors: yes

    - name: Initialisation du cluster PostgreSQL si nécessaire
      shell: |
        if [ ! -f /var/lib/postgresql/16/main/PG_VERSION ]; then
          sudo -u postgres /usr/lib/postgresql/16/bin/initdb -D /var/lib/postgresql/16/main
        fi
      become_user: root

    - name: Configuration du mot de passe postgres
      postgresql_user:
        name: "{{ postgres_user }}"
        password: "{{ postgres_password }}"
        encrypted: yes
      become_user: postgres

    - name: Création de l'utilisateur repmgr avec droits étendus
      postgresql_user:
        name: "{{ repmgr_user }}"
        password: "{{ repmgr_password }}"
        encrypted: yes
        role_attr_flags: SUPERUSER,LOGIN,CREATEROLE,CREATEDB,REPLICATION
      become_user: postgres

    - name: Configuration de search_path pour repmgr
      postgresql_query:
        db: postgres
        query: "ALTER USER {{ repmgr_user }} SET search_path TO {{ repmgr_database }}, \"\\$user\", public;"
      become_user: postgres

    - name: Création de la base repmgr
      postgresql_db:
        name: "{{ repmgr_database }}"
        owner: "{{ repmgr_user }}"
        state: present
      become_user: postgres

    - name: Configuration de pg_hba.conf
      template:
        src: pg_hba.conf.j2
        dest: "/etc/postgresql/16/main/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: '0644'
        backup: yes

    - name: Configuration de postgresql.conf (réplication)
      blockinfile:
        path: "/etc/postgresql/16/main/postgresql.conf"
        block: |
          # Configuration réplication pour repmgr
          wal_level = replica
          max_wal_senders = 10
          max_replication_slots = 10
          wal_keep_size = 2GB
          archive_mode = on
          archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
          shared_preload_libraries = 'repmgr'
          hot_standby = on
          listen_addresses = '*'
          port = 5432
        marker: "# {mark} ANSIBLE MANAGED BLOCK - REPLICATION CONFIG"
        create: yes
      become_user: root

    - name: Création du dossier d'archive WAL
      file:
        path: /var/lib/postgresql/wal_archive
        state: directory
        owner: postgres
        group: postgres
        mode: '0755'

    - name: Redémarrage PostgreSQL pour appliquer la configuration
      systemd:
        name: "postgresql@16-main"
        state: restarted
        enabled: yes

    - name: Attendre que PostgreSQL soit prêt
      shell: |
        sleep 5
        sudo -u postgres /usr/lib/postgresql/16/bin/pg_isready -h /var/run/postgresql -p 5432
      become_user: root
      retries: 3
      delay: 5

    - name: Installation de l'extension repmgr
      postgresql_ext:
        name: repmgr
        db: "{{ repmgr_database }}"
        state: present
      become_user: postgres
      ignore_errors: yes

    - name: Configuration des permissions repmgr
      postgresql_query:
        db: "{{ repmgr_database }}"
        query: |
          GRANT CONNECT ON DATABASE {{ repmgr_database }} TO {{ repmgr_user }};
          GRANT USAGE ON SCHEMA repmgr TO {{ repmgr_user }};
          GRANT SELECT ON ALL TABLES IN SCHEMA repmgr TO {{ repmgr_user }};
          GRANT INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA repmgr TO {{ repmgr_user }};
          GRANT USAGE ON ALL SEQUENCES IN SCHEMA repmgr TO {{ repmgr_user }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA repmgr GRANT SELECT ON TABLES TO {{ repmgr_user }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA repmgr GRANT INSERT, UPDATE, DELETE ON TABLES TO {{ repmgr_user }};
          ALTER DEFAULT PRIVILEGES IN SCHEMA repmgr GRANT USAGE ON SEQUENCES TO {{ repmgr_user }};
      become_user: postgres
      ignore_errors: yes

    - name: Affichage du statut PostgreSQL
      debug:
        msg: |
          🎉 PostgreSQL installé sur {{ inventory_hostname }} !
          📍 IP: {{ ansible_host }}
          🔧 Version: {{ postgresql_version }}
          👤 Utilisateur: {{ postgres_user }}
          🗄️ Base repmgr: {{ repmgr_database }}
