# =============================================================================
# Fichier de configuration environnement - Variables globales
# =============================================================================
# Ce fichier centralise les variables utilisées par tous les scripts
# Modifiez ces valeurs selon votre environnement
# =============================================================================

# -----------------------------------------------------------------------------
# PROXMOX
# -----------------------------------------------------------------------------
# IP ou hostname du serveur Proxmox
PM_HOST="192.168.0.1"

# Node Proxmox
PM_NODE="pve"

# Utilisateur SSH pour connexion Proxmox (scripts 2,3,4)
PM_SSH_USER="root"

# Répertoire distant sur Proxmox pour les scripts
REMOTE_DIR="/home/kevin-stage-devops"


# -----------------------------------------------------------------------------
# RÉSEAU
# -----------------------------------------------------------------------------
# Interface réseau/bridge pour les VMs
NET_BRIDGE="vmbr1"

# Sous-réseau (sans le dernier octet)
SUBNET="192.168.20"

# Domaine DNS principal pour l'infrastructure
# Utilisé par les services (Harbor, ArgoCD, GitLab, etc.)
DOMAIN="greencontracts.org"

# DNS server
DNS_SERVER="8.8.8.8"

# Gateway par défaut (IP LAN du firewall OPNsense)
# GATEWAY="192.168.20.1"
GATEWAY="${SUBNET}.1"

# -----------------------------------------------------------------------------
# FIREWALL - OPNsense (via API)
# -----------------------------------------------------------------------------
# Adresse IP WAN de l'OPNsense (pour accès API depuis le réseau management)
FIREWALL_WAN_IP="192.168.0.50"

# Adresse IP LAN de l'OPNsense (gateway des VMs)
FIREWALL_LAN_IP="${GATEWAY}" 

# Interface LAN dans OPNsense (généralement "lan" ou "igb1", "em1", etc.)
#FIREWALL_LAN_IF="lan"

# Interface WAN dans OPNsense
#FIREWALL_WAN_IF="wan"

# Fichier contenant les clés API (généré par 6a-generate-firewall-api-keys.sh)
# Ce fichier est sourcé automatiquement par le script 6-configure-firewall.sh
#FIREWALL_API_KEYS_FILE="${SCRIPT_DIR}/ssh/opnsense-conf-co.txt"
# API Key et Secret (à générer dans OPNsense: System > Access > API)
# Format: key=base64(value)
# Exemple: ybBQlEHkT/SZzCicFoslDEqZgE6Y6I3NPdU75+at/XuNlBjxs2BfJA==
#FIREWALL_API_KEY=""
#FIREWALL_API_SECRET=""

# Activer/désactiver la configuration automatique du firewall
#FIREWALL_AUTO_CONFIGURE="false"

# Ports à ouvrir automatiquement (séparés par virgule)
#FIREWALL_SSH_PORT="22"
#FIREWALL_HTTP_PORT="80"
#FIREWALL_HTTPS_PORT="443"
#FIREWALL_POSTGRES_PORT="5432"
#FIREWALL_K8S_API_PORT="6443"

# =============================================================================
# NOTES:
# - Ce fichier est sourcé par les scripts shell (source env.conf)
# - Les variables sont exportées pour être disponibles dans les sous-processus
# - En mode 'prod', pensez à supprimer VM_PASSWORD ou le laisser vide
# - Pour modifier le comportement, changez les valeurs ci-dessus
# - Pour OPNsense: générer les clés API dans System > Access > API
# =============================================================================


# -----------------------------------------------------------------------------
# AUTHENTIFICATION VMs
# -----------------------------------------------------------------------------
# Utilisateur SSH pour les VMs créées
VM_SSH_USER="ubuntu"

# Mot de passe pour les VMs (mode DEV uniquement - CHANGEZ CETTE VALEUR!)
VM_PASSWORD="ubuntu"

# -----------------------------------------------------------------------------
# CONFIGURATION DISTANTE (sur serveur Proxmox)
# TEMPLATES
# -----------------------------------------------------------------------------
# ID du template à utiliser (9001=Debian13, 9002=Ubuntu24, 9003=Ubuntu26)
TEMPLATE_ID="9002"

# Storage pour les disks
DISK_STORAGE="local-lvm"

# -----------------------------------------------------------------------------
# PARAMÈTRES VMs PAR DÉFAUT
# -----------------------------------------------------------------------------
# VMID de départ pour les nouvelles VMs
VMID_START="200"

# Valeurs par défaut pour les VMs
DEFAULT_CORES="1"
DEFAULT_MEMORY="2048"
DEFAULT_DISK="20"

# -----------------------------------------------------------------------------
# MODE (dev/prod)
# -----------------------------------------------------------------------------
# dev = mot de passe + clé SSH / prod = clé SSH uniquement
MODE="dev"

# -----------------------------------------------------------------------------
# MODE DÉPLOIEMENT TERRAFORM
# -----------------------------------------------------------------------------
# 1 = RAPIDE (défaut): VMs créées éteintes, 30s par VM
# 2 = COMPLET: VMs créées et démarrées, attente cloud-init (5-10min)
# Mettre à 2 si vous voulez que les VMs démarrent automatiquement
DEPLOY_MODE="1"

# -----------------------------------------------------------------------------
# SCRIPT 3 - TÉLÉCHARGEMENT IMAGES
# -----------------------------------------------------------------------------
# Quelle(s) image(s) télécharger: debian | 24.04 | 26.04 | all
# - debian  : Debian 13 uniquement
# - 24.04   : Ubuntu 24.04 uniquement
# - 26.04   : Ubuntu 26.04 uniquement
# - all     : Toutes les images (défaut)
SCRIPT3_ARG="all"
#SCRIPT3_ARG="24.04"
