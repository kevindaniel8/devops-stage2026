---
- name: Ensure snapd is installed
  ansible.builtin.apt:
    name: snapd
    state: present
    update_cache: true

- name: Ensure snapd service is started
  ansible.builtin.systemd:
    name: snapd
    enabled: true
    state: started

- name: Check if Nextcloud snap is installed
  ansible.builtin.command:
    cmd: snap list nextcloud
  register: nextcloud_snap
  failed_when: false
  changed_when: false

- name: Install Nextcloud
  ansible.builtin.command:
    cmd: snap install nextcloud
  when: nextcloud_snap.rc != 0

- name: Wait for snap initialization
  ansible.builtin.pause:
    seconds: 30

- name: Check Nextcloud installed status
  ansible.builtin.command:
    cmd: nextcloud.occ status
  register: nextcloud_status
  failed_when: false
  changed_when: false

- name: Extract installation state
  ansible.builtin.set_fact:
    nextcloud_is_installed: "{{ 'installed: true' in nextcloud_status.stdout }}"

- name: Debug installation state
  ansible.builtin.debug:
    msg: "Nextcloud installed = {{ nextcloud_is_installed }}"

- name: Run Nextcloud initial installation
  ansible.builtin.command:
    cmd: >
      nextcloud.manual-install
      {{ nextcloud_admin_user }}
      {{ nextcloud_admin_password }}
  when: not nextcloud_is_installed

- name: Wait after installation
  ansible.builtin.pause:
    seconds: 10
  when: not nextcloud_is_installed

- name: Configure trusted domains
  ansible.builtin.command:
    cmd: >
      nextcloud.occ config:system:set trusted_domains {{ index }}
      --value={{ item }}
  loop: "{{ nextcloud_trusted_domains }}"
  loop_control:
    index_var: index
  changed_when: true

- name: Configure HTTP port
  ansible.builtin.command:
    cmd: >
      snap set nextcloud ports.http={{ nextcloud_listen_port }}
  when: nextcloud_listen_port != 80
  notify: Restart Nextcloud

- name: Enable HTTPS self-signed
  ansible.builtin.command:
    cmd: nextcloud.enable-https self-signed
  when: nextcloud_enable_https

- name: Ensure Nextcloud services started
  ansible.builtin.command:
    cmd: snap start nextcloud
  changed_when: false