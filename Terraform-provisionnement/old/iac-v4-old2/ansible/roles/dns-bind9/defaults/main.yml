# Domaine DNS principal
dns_domain: "greencontracts.lan"

# IP du serveur DNS (auto depuis Ansible)
dns_server_ip: "{{ ansible_default_ipv4.address }}"

# IP du reverse proxy (à définir dans l'inventaire)
reverse_proxy_ip: "{{ hostvars['reverse-proxy'].ansible_host }}"

# Réseau local (dérivé automatiquement)
dns_network: "{{ dns_server_ip.split('.')[0:3] | join('.') }}"

# Zone inverse PTR (calculée automatiquement)
dns_reverse_zone: "{{ dns_network.split('.')[2] }}.{{ dns_network.split('.')[1] }}.{{ dns_network.split('.')[0] }}.in-addr.arpa"

# Enregistrements DNS (à définir dans l'inventaire)
dns_records: "{{ hostvars[inventory_hostname].dns_records | default([]) }}"
