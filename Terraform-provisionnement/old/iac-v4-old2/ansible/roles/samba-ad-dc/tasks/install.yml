---
- name: Ensure APT cache is up to date
  apt:
    update_cache: yes
  changed_when: false

- name: Install Samba AD DC and Bind9 DLZ stack
  apt:
    name:
      - samba-ad-dc
      - krb5-user
      - bind9
      - bind9utils
      - bind9-dnsutils
      - python3-dnspython
    state: present

- name: Remove default smb.conf generated by Samba package
  file:
    path: /etc/samba/smb.conf
    state: absent
  when: not samba_provisioned.stat.exists

- name: Stop and disable legacy Samba services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - smbd
    - nmbd
    - winbind

- name: Mask legacy services
  command: systemctl mask {{ item }}
  loop:
    - smbd
    - nmbd
    - winbind
  changed_when: false

- name: Enable samba-ad-dc service
  systemd:
    name: samba-ad-dc
    enabled: yes
