---
# 1️⃣ Vérifier que Docker est installé
- name: "1 - Vérifier que la commande docker existe"
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: docker_check.rc != 0

# 2️⃣ Vérifier que docker compose existe
- name: "2 - Vérifier que docker compose est disponible"
  ansible.builtin.command: docker compose version
  register: compose_check
  changed_when: false
  failed_when: compose_check.rc != 0
