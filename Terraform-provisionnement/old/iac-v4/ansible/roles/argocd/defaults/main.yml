---
argocd_namespace: argocd
argocd_manifest_url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

# Domaine pour ArgoCD - utilise la variable globale 'domain' de group_vars/all.yml
# ou fallback sur greencontracts.lan si non définie
argocd_domain: "argo.{{ domain | default('greencontracts.lan') }}"

# Activer l'accès par IP pour le développement (sans DNS)
argocd_enable_ip_access: true
argocd_ip: "{{ ansible_host }}"

#kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
