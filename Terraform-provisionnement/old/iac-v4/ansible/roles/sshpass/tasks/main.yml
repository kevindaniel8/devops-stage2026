---
# =============================================================================
# ROLE: sshpass
# Description: Installation de sshpass pour l'authentification SSH par mot de passe
# =============================================================================

- name: "SSHPASS | Mise à jour du cache APT"
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: "SSHPASS | Installation du package sshpass"
  apt:
    name: sshpass
    state: present
  become: yes

- name: "SSHPASS | Vérification de l'installation"
  command: which sshpass
  register: sshpass_check
  changed_when: false

- name: "SSHPASS | Affichage de la version"
  command: sshpass -V
  register: sshpass_version
  changed_when: false

- name: "SSHPASS | Confirmation"
  debug:
    msg: "✅ sshpass installé: {{ sshpass_version.stdout_lines[0] | default('Version inconnue') }}"
