---

# ---------------------------------------------------------
# 1. Install system dependencies
# ---------------------------------------------------------
- name: 1.1 Install required system packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  become: true


# ---------------------------------------------------------
# 2. Install Docker (optional)
# ---------------------------------------------------------
- name: 2.0 Install Docker if requested
  when: install_docker
  block:

    - name: 2.1 Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      become: true

    - name: 2.2 Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename | default(ansible_distribution_release) }} stable
      become: true

    - name: 2.2.1 Update apt cache after adding Docker repo
      apt:
        update_cache: yes
      become: true

    - name: 2.3 Install Docker engine and compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      become: true

    - name: 2.4 Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: true
      become: true

    - name: 2.5 Add user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      become: true

# ---------------------------------------------------------
# 3.0 Force remove orphan Harbor containers (idempotent)
# ---------------------------------------------------------

- name: 3.0.1 List existing Harbor containers
  shell: "docker ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep '^harbor' || true"
  register: harbor_containers
  changed_when: false
  become: true

- name: 3.0.2 Remove orphan Harbor containers
  shell: "docker rm -f {{ item }}"
  loop: "{{ harbor_containers.stdout_lines }}"
  when: harbor_containers.stdout != ''
  become: true


# ---------------------------------------------------------
# 3. Clean previous Harbor installation (idempotent)
# ---------------------------------------------------------
- name: 3.1 Stop existing Harbor if present
  shell: docker compose down -v
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  ignore_errors: true
  become: true

- name: 3.2 Remove old Harbor installation directory
  file:
    path: "{{ harbor_install_dir }}/harbor"
    state: absent
  become: true

- name: 3.3 Remove old docker-compose.yml
  file:
    path: "{{ harbor_install_dir }}/docker-compose.yml"
    state: absent
  become: true

- name: 3.4 Ensure Harbor install directory exists
  file:
    path: "{{ harbor_install_dir }}"
    state: directory
    mode: "0755"
  become: true


# ---------------------------------------------------------
# 4. Download and extract Harbor installer
# ---------------------------------------------------------
- name: 4.1 Download Harbor installer
  get_url:
    url: "{{ harbor_download_url }}"
    dest: "{{ harbor_install_dir }}/{{ harbor_installer_filename }}"
    mode: "0644"
  become: true

- name: 4.2 Extract Harbor installer
  unarchive:
    src: "{{ harbor_install_dir }}/{{ harbor_installer_filename }}"
    dest: "{{ harbor_install_dir }}"
    remote_src: true
  become: true


# ---------------------------------------------------------
# 5. Ensure Harbor data directory exists
# ---------------------------------------------------------
- name: 5.1 Ensure Harbor data directory exists
  file:
    path: "{{ harbor_data_dir }}"
    state: directory
    mode: "0755"
  become: true


# ---------------------------------------------------------
# 6. Deploy harbor.yml
# ---------------------------------------------------------
- name: 6.1 Deploy harbor.yml
  template:
    src: "harbor.yml.j2"
    dest: "{{ harbor_install_dir }}/harbor/harbor.yml"
    mode: "0644"
  become: true


# ---------------------------------------------------------
# 7. Fix permissions (critical for prepare)
# ---------------------------------------------------------
- name: 7.1 Fix Harbor directory permissions
  file:
    path: "{{ harbor_install_dir }}/harbor"
    state: directory
    recurse: true
    owner: root
    group: root
    mode: "0755"
  become: true


# ---------------------------------------------------------
# 7.2 Clean and recreate Harbor input directory
# ---------------------------------------------------------
- name: 7.2.1 Remove Harbor input directory completely
  file:
    path: "{{ harbor_install_dir }}/harbor/input"
    state: absent
  become: true

- name: 7.2.2 Recreate Harbor input directory
  file:
    path: "{{ harbor_install_dir }}/harbor/input"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true


# ---------------------------------------------------------
# 7.3 Generate Harbor HTTPS certificates (required when https.enabled=true)
# ---------------------------------------------------------

- name: 7.3.1 Create Harbor certs directory
  file:
    path: "{{ harbor_install_dir }}/certs"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: 7.3.2 Generate Harbor private key
  command: >
    openssl genrsa -out {{ harbor_install_dir }}/certs/harbor.key 2048
  args:
    creates: "{{ harbor_install_dir }}/certs/harbor.key"
  become: true

- name: 7.3.3 Generate Harbor certificate
  command: >
    openssl req -x509 -new -nodes
    -key {{ harbor_install_dir }}/certs/harbor.key
    -sha256 -days 365
    -subj "/CN={{ hostname }}"
    -out {{ harbor_install_dir }}/certs/harbor.crt
  args:
    creates: "{{ harbor_install_dir }}/certs/harbor.crt"
  become: true



# ---------------------------------------------------------
# 8. Run Harbor prepare
# ---------------------------------------------------------
- name: 8.1 Run Harbor prepare
  shell: ./prepare --with-trivy
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  become: true


# ---------------------------------------------------------
# 9. Install Harbor
# ---------------------------------------------------------
- name: 9.1 Install Harbor
  shell: |
    ./install.sh {{ '--with-trivy' if enable_trivy else '' }} \
                 {{ '--with-notary' if enable_notary else '' }} \
                 {{ '--with-chartmuseum' if enable_chartmuseum else '' }}
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  become: true
