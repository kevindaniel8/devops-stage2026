all:
  vars:
    # Idempotence: Gestion automatique des clés SSH host
    # Évite les erreurs lorsque les VMs sont recréées avec de nouvelles clés
    ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  children:

    reverse_proxy:
      hosts:
        reverse-proxy:
          ansible_host: 192.168.20.253
          ansible_user: ubuntu

    cert_clients:
      hosts:
 #       dns-bind9:
 #         ansible_host: 192.168.20.254
 #         ansible_user: ubuntu

        snmp:
          ansible_host: 192.168.20.20
          ansible_user: ubuntu

        wikijs:
          ansible_host: 192.168.20.30
          ansible_user: ubuntu

#        gitlab:
#          ansible_host: 192.168.20.40
#          ansible_user: ubuntu
#          ansible_password: "ubuntu"
#          ansible_become_password: "ubuntu"
#          ansible_ssh_common_args: "-o PreferredAuthentications=password"

        harbor:
          ansible_host: 192.168.20.205
          ansible_user: ubuntu

        k3s-manager:
          ansible_host: 192.168.20.220
          ansible_user: ubuntu

        k3s-worker1:
          ansible_host: 192.168.20.221
          ansible_user: ubuntu

        k3s-worker2:
          ansible_host: 192.168.20.222
          ansible_user: ubuntu

        samba-ad-dc:
          ansible_host: 192.168.20.2
          ansible_user: ubuntu
          ansible_become: true
          #ansible_private_key_file: /home/kevin/Test-samba-ad-dc/v2/.vagrant/machines/default/virtualbox/private_key


    # Tes groupes existants restent inchangés
    dns:
      hosts:
        dns-bind9:

    dns_clients:
      children:
        k3s_manager:
        k3s_worker:
      hosts:
        reverse-proxy:
        snmp:
        wikijs:
        gitlab:
        harbor:

    k3s_manager:
      hosts:
        k3s-manager:

    k3s_worker:
      hosts:
        k3s-worker1:
        k3s-worker2:

    dc:
      hosts:
        samba-ad-dc:

    # -------------------------------------------------------------------------
    # CLUSTER POSTGRESQL (pour tests repmgr)
    # -------------------------------------------------------------------------
    # Déploiement via clé SSH (ansible-playbook)
    # Accès manuel via mot de passe toujours disponible
    # -------------------------------------------------------------------------
    database:
      children:
        db_master:
        db_replica:
      vars:
        ansible_user: ubuntu
        # Clé SSH pour le déploiement ansible
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_terraform-proxmox
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        ansible_python_interpreter: /usr/bin/python3
        # Password devient optionnel (pour become)
        ansible_become_password: "ubuntu"

    db_master:
      hosts:
        db-postgres-master:
          ansible_host: 192.168.20.20
          node_id: 1
          node_name: db-postgres-master

    db_replica:
      hosts:
        db-postgres-replication:
          ansible_host: 192.168.20.21
          node_id: 2
          node_name: db-postgres-replication
          upstream_node_id: 1
          upstream_node_name: db-postgres-master

    # -------------------------------------------------------------------------
    # MARIADB (groupe existant)
    # -------------------------------------------------------------------------
    db:
      hosts:
        mariadb:
          ansible_host: 192.168.20.30
          ansible_user: ubuntu
          ansible_password: "ubuntu"
          ansible_become_password: "ubuntu"
          ansible_ssh_common_args: "-o PreferredAuthentications=password"
          ansible_python_interpreter: /usr/bin/python3



