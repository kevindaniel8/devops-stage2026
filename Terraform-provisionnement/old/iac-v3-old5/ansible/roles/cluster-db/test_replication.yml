---
# Test complet de réplication du cluster
- name: Test de réplication PostgreSQL repmgr
  hosts: postgresql_cluster
  become: yes
  vars_files:
    - group_vars/all.yml
  roles:
    - testing

- name: Vérification du cluster après test
  hosts: postgresql_masters
  become: yes
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Statut du cluster repmgr
      shell: |
        export PGPASSWORD={{ repmgr_password }}
        repmgr -f /etc/repmgr/{{ postgresql_version }}/repmgr.conf cluster show
      become_user: postgres
      register: cluster_status

    - name: Affichage du statut final
      debug:
        msg: |
          ==========================================
          Test de réplication terminé
          ==========================================
          Statut du cluster:
          {{ cluster_status.stdout_lines | join('\n') }}
