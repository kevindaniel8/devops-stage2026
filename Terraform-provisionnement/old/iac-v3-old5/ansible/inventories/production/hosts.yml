# =============================================================================
# INVENTAIRE PRODUCTION - Cluster PostgreSQL avec repmgr
# =============================================================================
# Structure:
#   - database (master + replica)
#   - db_master (nœud primaire)
#   - db_replica (nœud secondaire)
# =============================================================================

all:
  children:

    # -------------------------------------------------------------------------
    # CLUSTER POSTGRESQL
    # -------------------------------------------------------------------------
    database:
      children:
        db_master:
        db_replica:
      vars:
        ansible_user: ubuntu
        ansible_password: ubuntu
        ansible_become_password: ubuntu
        ansible_ssh_common_args: "-o PreferredAuthentications=password -o StrictHostKeyChecking=no"
        ansible_python_interpreter: /usr/bin/python3

    db_master:
      hosts:
        db-postgres-master:
          ansible_host: 192.168.20.20
          node_id: 1

    db_replica:
      hosts:
        db-postgres-replication:
          ansible_host: 192.168.20.21
          node_id: 2

    # -------------------------------------------------------------------------
    # SERVICES EXISTANTS (inchangés)
    # -------------------------------------------------------------------------
    reverse_proxy:
      hosts:
        reverse-proxy:
          ansible_host: 192.168.20.253
          ansible_user: ubuntu

    cert_clients:
      hosts:
        dns-bind9:
          ansible_host: 192.168.20.254
          ansible_user: ubuntu

        snmp:
          ansible_host: 192.168.20.20
          ansible_user: ubuntu

        wikijs:
          ansible_host: 192.168.20.30
          ansible_user: ubuntu

        gitlab:
          ansible_host: 192.168.20.40
          ansible_user: ubuntu

        harbor:
          ansible_host: 192.168.20.50
          ansible_user: ubuntu

        k3s-manager:
          ansible_host: 192.168.20.250
          ansible_user: ubuntu

        k3s-worker1:
          ansible_host: 192.168.20.251
          ansible_user: ubuntu

        k3s-worker2:
          ansible_host: 192.168.20.252
          ansible_user: ubuntu

    # -------------------------------------------------------------------------
    # GROUPES EXISTANTS
    # -------------------------------------------------------------------------
    dns:
      hosts:
        dns-bind9:

    dns_clients:
      children:
        k3s_manager:
        k3s_worker:
      hosts:
        reverse-proxy:
        snmp:
        wikijs:
        gitlab:
        harbor:

    k3s_manager:
      hosts:
        k3s-manager:

    k3s_worker:
      hosts:
        k3s-worker1:
        k3s-worker2:

    # -------------------------------------------------------------------------
    # GROUPES POUR LES PLAYBOOKS
    # -------------------------------------------------------------------------
    postgresql_servers:
      children:
        database
