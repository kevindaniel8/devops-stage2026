---
# Playbook de diagnostic du reverse-proxy
# Vérifie la connectivité vers les backends et les vhosts générés

- name: Diagnostiquer le reverse-proxy
  hosts: reverse_proxy
  become: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/dev/hosts.yml"
  tasks:
    - name: Lister les vhosts générés
      ansible.builtin.shell: ls -la /etc/nginx/sites-enabled/
      register: vhosts_list

    - name: Afficher les vhosts générés
      ansible.builtin.debug:
        var: vhosts_list.stdout_lines

    - name: Vérifier le contenu du vhost harbor
      ansible.builtin.shell: cat /etc/nginx/sites-available/harbor.conf
      register: harbor_vhost
      ignore_errors: true

    - name: Afficher le vhost harbor
      ansible.builtin.debug:
        var: harbor_vhost.stdout_lines
      when: harbor_vhost.skipped is not defined

    - name: Vérifier le contenu du vhost argocd
      ansible.builtin.shell: cat /etc/nginx/sites-available/argocd.conf
      register: argocd_vhost
      ignore_errors: true

    - name: Afficher le vhost argocd
      ansible.builtin.debug:
        var: argocd_vhost.stdout_lines
      when: argocd_vhost.skipped is not defined

    - name: Tester la connectivité vers harbor backend (192.168.20.205:80)
      ansible.builtin.wait_for:
        host: 192.168.20.205
        port: 80
        timeout: 5
      register: harbor_connect
      ignore_errors: true

    - name: Résultat connectivité harbor
      ansible.builtin.debug:
        msg: "Harbor backend (192.168.20.205:80) : {{ 'ACCESSIBLE' if harbor_connect.failed is not defined else 'NON ACCESSIBLE' }}"

    - name: Tester la connectivité vers argocd backend (192.168.20.220:30080)
      ansible.builtin.wait_for:
        host: 192.168.20.220
        port: 30080
        timeout: 5
      register: argocd_connect
      ignore_errors: true

    - name: Résultat connectivité argocd
      ansible.builtin.debug:
        msg: "ArgoCD backend (192.168.20.220:30080) : {{ 'ACCESSIBLE' if argocd_connect.failed is not defined else 'NON ACCESSIBLE' }}"

    - name: Tester HTTP vers harbor backend
      ansible.builtin.uri:
        url: http://192.168.20.205:80
        method: HEAD
        validate_certs: false
        timeout: 5
      register: harbor_http
      ignore_errors: true

    - name: Résultat HTTP harbor
      ansible.builtin.debug:
        msg: "Harbor HTTP response : {{ harbor_http.status | default('TIMEOUT') }}"

    - name: Tester HTTP vers argocd backend
      ansible.builtin.uri:
        url: http://192.168.20.220:30080
        method: HEAD
        validate_certs: false
        timeout: 5
      register: argocd_http
      ignore_errors: true

    - name: Résultat HTTP argocd
      ansible.builtin.debug:
        msg: "ArgoCD HTTP response : {{ argocd_http.status | default('TIMEOUT') }}"

    - name: Vérifier la configuration Nginx
      ansible.builtin.shell: nginx -t
      register: nginx_test

    - name: Afficher le test Nginx
      ansible.builtin.debug:
        var: nginx_test.stdout_lines
