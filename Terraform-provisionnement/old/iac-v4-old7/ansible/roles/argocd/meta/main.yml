---
# ============================================================================
# META - PROJET DE STAGE
# ============================================================================
# Éntreprise             : e-petitpas.pro
# Stagiare               : DANIEL Kevin
# Objectif personnel     : Création d'une startup GreenContracts (objectif futur)
# Sujet                  : Conception et mise en place d'une infrastructure
#                          DevOps automatisée avec Terraform, Ansible et Kubernetes
# ============================================================================
#
# CONTEXTE DU PROJET :
# --------------------
# Ce projet de stage vise à concevoir, étudier et proposer une architecture
# d'infrastructure moderne pour e-petitpas.pro.
#
# RÉALISATIONS :
# -------------
#   ✓ Infrastructure as Code avec Terraform sur Proxmox
#   ✓ Configuration management idempotente avec Ansible
#   ✓ Cluster Kubernetes K3s avec ArgoCD
#   ✓ GitOps pour déploiement automatique des applications
#   ✓ Registry Docker privée Harbor avec Trivy
#   ✓ Cluster PostgreSQL HA avec repmgr
#   ✓ Scripts d'automatisation et documentation complète
#
# CE RÔLE :
# ----------
# Ce rôle Ansible déploie ArgoCD sur cluster K3s avec :
#   - Exposition via Ingress (domaine personnalisé)
#   - Accès direct par IP (NodePort pour développement)
#   - Configuration GitOps prête à l'emploi
#   - Intégration avec le domaine défini dans env.conf
#
# ARCHITECTURE :
# --------------
#                          ┌─────────────────┐
#                          │   Utilisateurs  │
#                          └────────┬────────┘
#                                   │
#                          ┌────────▼────────┐
#                          │  Nginx/Traefik  │
#                          │  (Reverse Proxy)│
#                          └────────┬────────┘
#                                   │
#              ┌────────────────────┼────────────────────┐
#              │                    │                    │
#     ┌────────▼────────┐  ┌────────▼────────┐  ┌───────▼────────┐
#     │   K3s Cluster   │  │   ArgoCD        │  │   Harbor       │
#     │   (Apps)        │  │   (GitOps)      │  │   (Registry)   │
#     │                 │  │                 │  │                │
#     │  ┌───────────┐  │  │  ┌───────────┐  │  │  ┌──────────┐  │
#     │  │  Pods     │  │  │  │ UI Web    │  │  │  │ Registry │  │
#     │  │  Services │  │  │  │ CLI       │  │  │  │ Trivy    │  │
#     │  └───────────┘  │  │  └───────────┘  │  │  └──────────┘  │
#     └─────────────────┘  └────────┬────────┘  └────────────────┘
#                                   │
#                          ┌────────▼────────┐
#                          │   Repos Git     │
#                          │   (Sources)     │
#                          └─────────────────┘
#
# ACCÈS ARGOCD :
# ---------------
#   - Domaine : https://argo.greencontracts.lan
#   - IP Directe : http://192.168.20.220:30080 (développement)
#
# DÉPENDANCES :
# -------------
#   - K3s cluster opérationnel (k3s-manager)
#   - kubectl configuré sur le nœud
#   - Variable 'domain' définie dans group_vars/all.yml
#
# NOTES :
# -------
# - Le HTTPS est désactivé pour le dev (server.insecure: true)
# - En production, activer HTTPS via Traefik/LetsEncrypt
# - Le domaine est centralisé dans env.conf
#
# Contact : kevin.daniel@greencontracts.lan (futur)
# Date    : Mai 2026
# Auteur  : Kevin DANIEL
# ============================================================================

galaxy_info:
  author: Kevin DANIEL
  description: "Déploiement ArgoCD sur K3s avec GitOps - Projet de stage e-petitpas.pro / GreenContracts"
  license: MIT
  min_ansible_version: "2.12"
  platforms:
    - name: Ubuntu
      versions:
        - noble
dependencies: []
