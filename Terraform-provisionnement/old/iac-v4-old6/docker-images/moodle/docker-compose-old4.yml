version: '3.8'

# Docker Compose pour test local avec PostgreSQL EXTERNE
# En production (K3s), utilise le cluster PostgreSQL à 192.168.20.20

services:
  moodle:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      # Connexion à PostgreSQL EXTERNE (cluster existant)
      MOODLE_DATABASE_TYPE: pgsql
      MOODLE_DATABASE_HOST: ${MOODLE_DB_HOST:-192.168.20.20}  # IP cluster PostgreSQL
      MOODLE_DATABASE_PORT_NUMBER: ${MOODLE_DB_PORT:-5432}
      MOODLE_DATABASE_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DATABASE_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DB_PASSWORD:-motdepasse}
      # Config admin Moodle
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-Admin@123}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      MOODLE_SITE_NAME: ${MOODLE_SITE:-Moodle K3s}
      MOODLE_HOST: ${MOODLE_HOST:-localhost}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
    volumes:
      - moodle-data:/var/www/moodledata
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  moodle-data:

# Test local avec PostgreSQL externe:
# MOODLE_DB_HOST=192.168.20.20 MOODLE_DB_PASSWORD=motdepasse docker-compose up -d
