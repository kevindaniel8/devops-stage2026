---
# Rôle pour le déploiement de LAM en Docker
# Dépend du rôle Docker

- name: Créer le répertoire LAM
  file:
    path: /opt/lam
    state: directory
    mode: '0755'

- name: Créer le fichier docker-compose.yml pour LAM
  template:
    src: docker-compose.yml.j2
    dest: /opt/lam/docker-compose.yml
    mode: '0644'

- name: Copier le fichier de configuration LAM
  template:
    src: lam.conf
    dest: /opt/lam/lam.conf
    mode: '0644'

- name: Démarrer LAM avec Docker Compose
  shell:
    cmd: docker compose up -d
    chdir: /opt/lam

- name: Attendre que LAM soit prêt
  wait_for:
    port: "{{ lam_port }}"
    host: 0.0.0.0
    timeout: 60

- name: Vérifier que LAM est en cours d'exécution
  uri:
    url: http://localhost:{{ lam_port }}
    method: GET
    status_code: 200
  register: lam_check
  retries: 5
  delay: 10

- name: Afficher l'URL de LAM
  debug:
    msg: "LAM accessible à: http://{{ ansible_default_ipv4.address }}:{{ lam_port }}"
