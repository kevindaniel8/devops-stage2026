---
# =============================================================================
# Rôle ssl-letsencrypt - Gestion des certificats Let's Encrypt
# =============================================================================

# -----------------------------------------------------------------------------
# 0. Installation de Certbot (uniquement sur reverse-proxy)
# -----------------------------------------------------------------------------
- name: Installer Certbot et plugin Nginx
  ansible.builtin.apt:
    name:
      - "{{ ssl_letsencrypt_certbot_package }}"
      - "{{ ssl_letsencrypt_certbot_nginx_package }}"
    state: present
    update_cache: true
  become: true
  when: inventory_hostname in groups['reverse_proxy']

# -----------------------------------------------------------------------------
# 1. Création des dossiers
# -----------------------------------------------------------------------------
- name: Créer le dossier SSL Nginx
  file:
    path: "{{ ssl_nginx_certs_path }}"
    state: directory
    mode: '0755'
  become: true
  when: inventory_hostname in groups['reverse_proxy']

# -----------------------------------------------------------------------------
# 2. Génération des certificats Let's Encrypt
# -----------------------------------------------------------------------------
- name: Générer les certificats Let's Encrypt pour services exposés
  block:
    - name: Obtenir certificat Let's Encrypt via certbot pour {{ item.key }}
      command: >
        certbot certonly --nginx
        --non-interactive
        --agree-tos
        --email {{ ssl_letsencrypt_email }}
        -d {{ item.value.fqdn }}
        {{ '--staging' if ssl_letsencrypt_staging else '' }}
        --cert-name {{ item.key }}
        --keep-until-expiring
      args:
        creates: "{{ ssl_letsencrypt_certs_path }}/{{ item.key }}/fullchain.pem"
      loop: "{{ ssl_letsencrypt_services }}"
      loop_control:
        label: "{{ item.key }}"
      become: true
      when: inventory_hostname in groups['reverse_proxy']
      notify: Reload nginx

  when:
    - inventory_hostname in groups['reverse_proxy']
    - ssl_letsencrypt_services | length > 0

# -----------------------------------------------------------------------------
# 3. Copie des certificats vers le dossier Nginx
# -----------------------------------------------------------------------------
- name: Copier les certificats Let's Encrypt vers Nginx
  block:
    - name: Copier le certificat pour {{ item.key }}
      copy:
        src: "{{ ssl_letsencrypt_certs_path }}/{{ item.key }}/fullchain.pem"
        dest: "{{ ssl_nginx_certs_path }}/{{ item.key }}.crt"
        remote_src: true
        mode: '0644'
      loop: "{{ ssl_letsencrypt_services }}"
      loop_control:
        label: "{{ item.key }}"
      become: true
      notify: Reload nginx

    - name: Copier la clé privée pour {{ item.key }}
      copy:
        src: "{{ ssl_letsencrypt_certs_path }}/{{ item.key }}/privkey.pem"
        dest: "{{ ssl_nginx_certs_path }}/{{ item.key }}.key"
        remote_src: true
        mode: '0400'
      loop: "{{ ssl_letsencrypt_services }}"
      loop_control:
        label: "{{ item.key }}"
      become: true
      notify: Reload nginx

  when:
    - inventory_hostname in groups['reverse_proxy']
    - ssl_letsencrypt_services | length > 0

# -----------------------------------------------------------------------------
# 4. Configuration du renouvellement automatique
# -----------------------------------------------------------------------------
- name: Créer le cron job pour le renouvellement automatique
  ansible.builtin.cron:
    name: "Renouvellement automatique certificats Let's Encrypt"
    job: "certbot renew --quiet --deploy-hook 'systemctl reload nginx'"
    minute: "0"
    hour: "3"
    weekday: "*"
    user: root
  become: true
  when: inventory_hostname in groups['reverse_proxy']

# -----------------------------------------------------------------------------
# 5. Déploiement de la CA Let's Encrypt sur les clients
# -----------------------------------------------------------------------------
- name: Télécharger la CA Let's Encrypt (DST Root CA X3)
  get_url:
    url: https://letsencrypt.org/certs/isrgrootx1.pem
    dest: /tmp/isrgrootx1.pem
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true

- name: Déployer la CA Let's Encrypt sur les clients
  copy:
    src: /tmp/isrgrootx1.pem
    dest: /usr/local/share/ca-certificates/letsencrypt-isrgrootx1.crt
    mode: '0644'
  become: true

- name: Mettre à jour le store de certificats
  command: update-ca-certificates
  become: true
  changed_when: true
