---
- name: Ensure snapd is installed
  ansible.builtin.apt:
    name: snapd
    state: present
    update_cache: true

- name: Ensure snapd service is enabled
  ansible.builtin.systemd:
    name: snapd
    enabled: true
    state: started

###########################################################################
# INSTALL SNAP
###########################################################################

- name: Check if Nextcloud snap is installed
  ansible.builtin.command:
    cmd: snap list nextcloud
  register: nextcloud_snap
  failed_when: false
  changed_when: false

- name: Install Nextcloud snap
  ansible.builtin.command:
    cmd: snap install nextcloud
  when: nextcloud_snap.rc != 0

###########################################################################
# WAIT SNAP SERVICES
###########################################################################

- name: Wait for Nextcloud snap services
  ansible.builtin.command:
    cmd: nextcloud.occ status
  register: nextcloud_status_wait
  retries: 30
  delay: 10
  until: nextcloud_status_wait.rc == 0
  changed_when: false
  failed_when: false

###########################################################################
# CHECK INSTALLATION STATE
###########################################################################

- name: Read Nextcloud status
  ansible.builtin.command:
    cmd: nextcloud.occ status
  register: nextcloud_status
  changed_when: false
  failed_when: false

- name: Detect if Nextcloud is initialized
  ansible.builtin.set_fact:
    nextcloud_initialized: "{{ 'installed: true' in nextcloud_status.stdout }}"

###########################################################################
# INITIAL INSTALL
###########################################################################

- name: Initialize Nextcloud
  ansible.builtin.command:
    cmd: >
      nextcloud.manual-install
      {{ nextcloud_admin_user }}
      {{ nextcloud_admin_password }}
  when: not nextcloud_initialized

###########################################################################
# WAIT AFTER INITIAL INSTALL
###########################################################################

- name: Wait for Nextcloud initialization completion
  ansible.builtin.command:
    cmd: nextcloud.occ status
  register: nextcloud_post_install
  retries: 30
  delay: 5
  until: >
    nextcloud_post_install.rc == 0 and
    'installed: true' in nextcloud_post_install.stdout
  changed_when: false

###########################################################################
# TRUSTED DOMAINS
###########################################################################

- name: Read current trusted domains
  ansible.builtin.command:
    cmd: nextcloud.occ config:system:get trusted_domains
  register: trusted_domains_current
  changed_when: false
  failed_when: false

- name: Configure trusted domains
  ansible.builtin.command:
    cmd: >
      nextcloud.occ config:system:set trusted_domains {{ index }}
      --value={{ item }}
  loop: "{{ nextcloud_trusted_domains }}"
  loop_control:
    index_var: index
  when: item not in trusted_domains_current.stdout
  changed_when: true

###########################################################################
# HTTP PORT
###########################################################################

- name: Read current HTTP port
  ansible.builtin.command:
    cmd: snap get nextcloud ports.http
  register: current_http_port
  changed_when: false
  failed_when: false

- name: Configure HTTP port
  ansible.builtin.command:
    cmd: snap set nextcloud ports.http={{ nextcloud_listen_port }}
  when: current_http_port.stdout != (nextcloud_listen_port | string)
  notify: Restart Nextcloud

###########################################################################
# HTTPS SELF SIGNED
###########################################################################

- name: Check HTTPS status
  ansible.builtin.command:
    cmd: nextcloud.occ config:system:get overwriteprotocol
  register: https_status
  changed_when: false
  failed_when: false

- name: Enable self-signed HTTPS
  ansible.builtin.command:
    cmd: nextcloud.enable-https self-signed
  when:
    - nextcloud_enable_https_self_signed
    - "'https' not in https_status.stdout"

###########################################################################
# ENSURE SERVICES
###########################################################################

- name: Ensure Nextcloud services are started
  ansible.builtin.command:
    cmd: snap start nextcloud
  changed_when: false


###########################################################################
# NEXTCLOUD OFFICE
###########################################################################

- name: Check if richdocuments app is enabled
  ansible.builtin.command:
    cmd: nextcloud.occ app:list
  register: nextcloud_apps
  changed_when: false

- name: Install richdocuments app
  ansible.builtin.command:
    cmd: nextcloud.occ app:install richdocuments
  when: "'richdocuments:' not in nextcloud_apps.stdout"

- name: Install richdocumentscode app
  ansible.builtin.command:
    cmd: nextcloud.occ app:install richdocumentscode
  when: "'richdocumentscode:' not in nextcloud_apps.stdout"

- name: Enable richdocuments app
  ansible.builtin.command:
    cmd: nextcloud.occ app:enable richdocuments
  when: "'richdocuments: enabled' not in nextcloud_apps.stdout"

- name: Enable richdocumentscode app
  ansible.builtin.command:
    cmd: nextcloud.occ app:enable richdocumentscode
  when: "'richdocumentscode: enabled' not in nextcloud_apps.stdout"

- name: Restart Nextcloud
  ansible.builtin.command:
    cmd: snap restart nextcloud