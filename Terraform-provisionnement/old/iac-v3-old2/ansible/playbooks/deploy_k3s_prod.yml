---
# =============================================================================
# PLAYBOOK K3s PRODUCTION - Déploiement Cluster Kubernetes
# =============================================================================
# Ce playbook est optimisé pour la production avec récupération automatique
# du token depuis le manager existant ou génération d'un nouveau token sécurisé.
#
# Différences avec deploy_k3s.yml (dev):
#   - Token dynamique (récupéré ou généré automatiquement)
#   - Pas de token fixe "changeme"
#   - Plus sécurisé pour les environnements de production
# =============================================================================

- import_playbook: k3s-manager.yml

- name: Préparer la configuration globale K3s
  hosts: k3s_manager
  gather_facts: yes
  tasks:
    - name: Vérifier si K3s existe déjà sur le manager
      stat:
        path: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_file

    - name: Récupérer le token existant
      command: cat /var/lib/rancher/k3s/server/node-token
      register: existing_token
      when: k3s_token_file.stat.exists
      changed_when: false

    - name: Générer un nouveau token si K3s n'existe pas encore
      set_fact:
        generated_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
      when: not k3s_token_file.stat.exists

    - name: Définir le token final (existant ou généré)
      set_fact:
        k3s_token: "{{ existing_token.stdout | default(generated_token) }}"

    - name: Afficher le token utilisé (masqué en production)
      debug:
        msg: "Token K3s récupéré/généré (longueur: {{ k3s_token | length }} caractères)"
      when: false  # Mettre à true pour déboguer uniquement

    - name: Construire l'URL du serveur K3s
      set_fact:
        k3s_server_url: "https://{{ ansible_host }}:6443"

    - name: Publier la config globale pour les workers
      add_host:
        name: "global_k3s_config"
        k3s_server_url: "{{ k3s_server_url }}"
        k3s_token: "{{ k3s_token }}"

    - name: Attendre que l'API K3s soit prête
      wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        delay: 5
        timeout: 120
        state: started
      become: no
      delegate_to: localhost

    - name: Vérifier que kubectl fonctionne
      command: k3s kubectl get nodes
      register: kubectl_check
      until: kubectl_check.rc == 0
      retries: 10
      delay: 5
      changed_when: false

- import_playbook: k3s-worker.yml
