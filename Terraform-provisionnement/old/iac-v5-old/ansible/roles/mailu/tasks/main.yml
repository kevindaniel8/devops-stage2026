---

- name: Créer dossier Mailu
  file:
    path: "{{ mailu_data_dir }}"
    state: directory
    mode: "0755"

- name: Créer sous-dossiers Mailu
  file:
    path: "{{ mailu_data_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - data
    - data/redis
    - mail
    - certs
    - overrides

- name: Générer .env Mailu
  template:
    src: mailu.env.j2
    dest: "{{ mailu_data_dir }}/.env"
    mode: "0600"
  notify: restart mailu

- name: Générer docker-compose Mailu
  template:
    src: docker-compose.yml.j2
    dest: "{{ mailu_data_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart mailu

- name: Lancer Mailu
  community.docker.docker_compose_v2:
    project_src: "{{ mailu_data_dir }}"
    state: present

- name: Attendre disponibilité Web Mailu
  wait_for:
    host: 127.0.0.1
    port: "{{ mailu_web_port }}"
    timeout: 300