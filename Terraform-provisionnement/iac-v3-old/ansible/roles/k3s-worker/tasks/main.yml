---
# Téléchargement du binaire K3s (idempotent)
- name: Vérifier si K3s est déjà installé
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Télécharger K3s (worker)
  get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: /usr/local/bin/k3s
    mode: '0755'
  when: not k3s_binary.stat.exists

- name: Installer service K3s worker
  template:
    src: k3s-worker.service.j2
    dest: /etc/systemd/system/k3s.service
  notify:
    - Reload systemd
    - Restart k3s

- name: Activer et démarrer K3s worker
  systemd:
    name: k3s
    enabled: yes
    state: started
  register: k3s_worker_service

- name: Démarrer K3s worker si pas encore actif
  systemd:
    name: k3s
    state: started
  when: k3s_worker_service is changed
