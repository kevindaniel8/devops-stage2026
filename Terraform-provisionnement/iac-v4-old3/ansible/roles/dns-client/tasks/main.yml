---
- name: Create systemd-resolved configuration directory
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'

- name: Deploy DNS configuration
  template:
    src: dns.conf.j2
    dest: /etc/systemd/resolved.conf.d/dns.conf
    mode: '0644'
  notify: Restart systemd-resolved

- name: Ensure systemd-resolved is enabled and running
  systemd:
    name: systemd-resolved
    enabled: yes
    state: started

- name: Ensure /etc/resolv.conf is a symlink to systemd-resolved
  file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: yes
