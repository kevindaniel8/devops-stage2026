---
- name: Initialisation de la base PostgreSQL pour Moodle
  hosts: db-postgres-master
  become: true
  become_user: postgres
  vars:
    moodle_db_name: "moodle"
    moodle_db_user: "moodle"
    moodle_db_password: "motdepasse"
  tasks:
    - name: Créer la base de données moodle
      postgresql_query:
        query: "SELECT 1 FROM pg_database WHERE datname='{{ moodle_db_name }}'"
      register: db_exists
      ignore_errors: true

    - name: Créer la base moodle si elle n'existe pas
      postgresql_db:
        name: "{{ moodle_db_name }}"
        state: present
        encoding: UTF8
        lc_collate: C.UTF-8
        lc_ctype: C.UTF-8
        template: template0
      when: db_exists.rowcount == 0

    - name: Créer l'utilisateur moodle
      postgresql_user:
        name: "{{ moodle_db_user }}"
        password: "{{ moodle_db_password }}"
        state: present
        priv: "{{ moodle_db_name }}.*:ALL"

    - name: Autoriser l'utilisateur moodle à se connecter depuis n'importe où
      postgresql_query:
        query: |
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ moodle_db_user }}') THEN
              CREATE ROLE {{ moodle_db_user }} WITH LOGIN PASSWORD '{{ moodle_db_password }}';
            END IF;
          END $$;
      ignore_errors: true

    - name: Modifier pg_hba.conf pour autoriser les connexions
      become: true
      become_user: root
      lineinfile:
        path: /etc/postgresql/16/main/pg_hba.conf
        line: "host    {{ moodle_db_name }}    {{ moodle_db_user }}    0.0.0.0/0    md5"
        state: present
      notify: reload postgresql

    - name: S'assurer que PostgreSQL écoute sur toutes les interfaces
      become: true
      become_user: root
      lineinfile:
        path: /etc/postgresql/16/main/postgresql.conf
        regexp: '^#?listen_addresses'
        line: "listen_addresses = '*'"
        state: present
      notify: reload postgresql

  handlers:
    - name: reload postgresql
      become: true
      service:
        name: postgresql
        state: reloaded
