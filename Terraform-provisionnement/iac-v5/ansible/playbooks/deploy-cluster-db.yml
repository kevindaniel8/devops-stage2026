---
# Playbook pour déployer le cluster PostgreSQL repmgr sur iac-v3
- name: Infrastructure PostgreSQL repmgr - iac-v3
  hosts: database
  become: yes
  serial: 1
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Arrêt rapide de unattended-upgrades (accélère le déploiement)
      shell: |
        systemctl stop unattended-upgrades 2>/dev/null || true
        systemctl disable unattended-upgrades 2>/dev/null || true
        pkill -9 unattended-upgrade 2>/dev/null || true
        sleep 2
        # Attente max 30s que apt soit libéré
        for i in {1..6}; do
          fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
          sleep 5
        done
        exit 0
      changed_when: false

    - name: Mise à jour du cache apt
      apt:
        update_cache: yes
        cache_valid_time: 3600
      register: apt_update
      retries: 5
      delay: 10
      until: apt_update is success

  roles:
    - role: ../roles/cluster-db/postgresql
    - role: ../roles/cluster-db/repmgr
  post_tasks:
    - name: Affichage des informations de connexion
      debug:
        msg: |
          ==========================================
          Cluster PostgreSQL repmgr déployé avec succès
          ==========================================
          
          📱 Connexions PostgreSQL:
          - Master: 192.168.20.20:5432 (postgres/postgres)
          - Replica: 192.168.20.21:5432 (postgres/postgres)
          
          🔧 Commandes utiles:
          - Vérifier le cluster: ansible -i inventories/dev/hosts.yml database -m shell -a "repmgr -f /etc/repmgr/16/repmgr.conf cluster show" -b
          
          📊 Monitoring:
          - pg_isready -h 192.168.20.20 -p 5432
          - pg_isready -h 192.168.20.21 -p 5432
          ==========================================
