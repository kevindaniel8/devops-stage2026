---
# 0 - Créer la base de données PostgreSQL pour Modoboa
- name: "0 - Créer la base de données PostgreSQL pour Modoboa"
  become: yes
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ modoboa_db_name }}"
    encoding: UTF8
    lc_collate: C.UTF-8
    lc_ctype: C.UTF-8
    template: template0
    state: present
  delegate_to: "{{ modoboa_db_host }}"

- name: "0 - Créer l'utilisateur PostgreSQL pour Modoboa"
  become: yes
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ modoboa_db_user }}"
    password: "{{ modoboa_db_password }}"
    db: "{{ modoboa_db_name }}"
    priv: "ALL"
    state: present
  delegate_to: "{{ modoboa_db_host }}"

- name: "0 - Accorder tous les privilèges à l'utilisateur Modoboa"
  become: yes
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: "{{ modoboa_db_name }}"
    role: "{{ modoboa_db_user }}"
    privs: "ALL"
    type: database
    state: present
  delegate_to: "{{ modoboa_db_host }}"

- name: "0 - Autoriser les connexions distantes pour Modoboa"
  become: yes
  lineinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    line: "host    {{ modoboa_db_name }}    {{ modoboa_db_user }}    0.0.0.0/0    md5"
    state: present
  delegate_to: "{{ modoboa_db_host }}"
  notify: Reload PostgreSQL
