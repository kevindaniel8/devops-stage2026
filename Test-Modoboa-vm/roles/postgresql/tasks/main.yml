###############################################################################
# 1. Vérifier que PostgreSQL est installé
###############################################################################
- name: 1 - Vérifier que psql est disponible
  command: which psql
  register: psql_check
  failed_when: psql_check.rc != 0
  changed_when: false


###############################################################################
# 2. Vérifier si la base modoboa existe
###############################################################################
- name: Vérifier si la base modoboa existe
  become: yes
  command: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='modoboa';"
  register: db_exists
  changed_when: false
  failed_when: false


###############################################################################
# 3. Créer la base modoboa si elle n'existe pas
###############################################################################
- name: 2 - Créer la base modoboa
  become: yes
  command: sudo -u postgres psql -c "CREATE DATABASE modoboa;"
  when: db_exists.stdout != "1"


###############################################################################
# 4. Vérifier si le mot de passe postgres est déjà défini
###############################################################################
- name: Vérifier si le mot de passe postgres est déjà défini
  become: yes
  command: sudo -u postgres psql -tAc "SELECT 1 FROM pg_shadow WHERE usename='postgres' AND passwd IS NOT NULL;"
  register: pw_exists
  changed_when: false
  failed_when: false


###############################################################################
# 5. Définir le mot de passe de postgres si nécessaire
###############################################################################
- name: 3 - Définir le mot de passe de postgres
  become: yes
  command: sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD '{{ postgres_password }}';"
  when: pw_exists.stdout != "1"


###############################################################################
# 6. Vérifier si postgres a déjà les droits sur la base modoboa
###############################################################################
- name: Vérifier si postgres a déjà les droits sur modoboa
  become: yes
  command: sudo -u postgres psql -tAc "SELECT has_database_privilege('postgres', 'modoboa', 'CONNECT');"
  register: grant_exists
  changed_when: false
  failed_when: false


###############################################################################
# 7. Donner les droits si nécessaire
###############################################################################
- name: 4 - Donner les droits à postgres sur modoboa
  become: yes
  command: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE modoboa TO postgres;"
  when: grant_exists.stdout != "t"

###############################################################################
# 8. Vérifier si l'utilisateur modoboa existe
###############################################################################
- name: Vérifier si l'utilisateur modoboa existe
  become: yes
  command: sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='modoboa';"
  register: modoboa_user_exists
  changed_when: false
  failed_when: false

###############################################################################
# 9. Créer l'utilisateur modoboa si nécessaire
###############################################################################
- name: Créer l'utilisateur modoboa
  become: yes
  command: sudo -u postgres psql -c "CREATE USER modoboa WITH PASSWORD '{{ modoboa_db_password }}';"
  when: modoboa_user_exists.stdout != "1"

###############################################################################
# 10. Donner les droits à l'utilisateur modoboa
###############################################################################
- name: Donner les droits à modoboa sur la base modoboa
  become: yes
  command: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE modoboa TO modoboa;"

###############################################################################
# 11. Donner les droits sur le schéma public
###############################################################################
- name: Donner les droits sur le schéma public à modoboa
  become: yes
  command: sudo -u postgres psql -d modoboa -c "GRANT ALL ON SCHEMA public TO modoboa;"
  register: schema_grant
  changed_when: false
  failed_when: false

###############################################################################
# 12. Donner les droits CREATEDB à l'utilisateur modoboa
###############################################################################
- name: Donner les droits CREATEDB à l'utilisateur modoboa
  become: yes
  command: sudo -u postgres psql -c "ALTER USER modoboa CREATEDB;"
  register: createdb_grant
  changed_when: false
  failed_when: false
  failed_when: false
