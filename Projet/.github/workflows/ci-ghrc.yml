name: CI-CD Docker GHCR

on:
  push:
    branches: [ "main/Projet" ]
  pull_request:

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/demo-trivy-app:latest
          docker build -t $IMAGE .

      - name: 3.Trivy – 3.1 Scan code (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      - name: 3.Trivy – 3.2 Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/demo-trivy-app:latest

      - name: 4. Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/demo-trivy-app:latest
          docker push $IMAGE

      - name: 5. Deploy container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            IMAGE=ghcr.io/${{ github.repository }}/demo-trivy-app:latest
            docker pull $IMAGE
            docker stop demo-trivy-app || true
            docker rm demo-trivy-app || true
            docker run -d --name demo-trivy-app -p 80:3000 $IMAGE
