---
- name: Update apt cache
  apt:
    update_cache: yes
  changed_when: false

- name: Install required packages
  apt:
    name:
      - samba-ad-dc
      - krb5-user
      - bind9-dnsutils
    state: present

- name: Stop and disable legacy samba services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - smbd
    - nmbd
    - winbind

- name: Mask legacy services
  command: systemctl mask {{ item }}
  loop:
    - smbd
    - nmbd
    - winbind

- name: Enable samba-ad-dc service
  systemd:
    name: samba-ad-dc
    enabled: yes
